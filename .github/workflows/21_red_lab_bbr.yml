name: "Red-lab + BBR (red experimental, backport de BBR 4.9 embebido)"

on:
  workflow_dispatch:
    inputs:
      wifi_ps_off:
        description: "Desactivar ahorro de energia Wi-Fi POR DEFECTO del kernel (CFG80211_DEFAULT_PS). Efecto incierto y NO se puede revertir sin reflashear; deja en false salvo que quieras probarlo."
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ============================================================
      # 1. CHECKOUTS
      # ============================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          # SHA fijo (antes: lineage-18.1). Punta usada en el build verde.
          ref: 6020dfa8315134187f07ca903c9d2ed7ee0256f5
          path: kernel
          fetch-depth: 1

      - name: Checkout GCC 6.4.1 toolchain
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          # SHA fijo (antes: lineage-18.1).
          ref: 16f73337b3616cfe640b0130629a9569b30482ca
          path: toolchain/aarch64
          fetch-depth: 1

      - name: Checkout kernel donante (BFQ + WireGuard)
        uses: actions/checkout@v4
        with:
          repository: prashantpaddune/android_kernel_samsung_a7y18lte
          # SHA fijo (antes: rama por defecto, sin fijar).
          ref: 97e4fbcdb31efe88b91cd321dae7bbaece36c51a
          path: donor
          fetch-depth: 1

      # ============================================================
      # 1b. DIAGNÓSTICO (no bloqueante): buscar infraestructura ya
      #     existente en ambos árboles para touch boost y curva térmica,
      #     antes de escribir cualquier parche a ciegas.
      # ============================================================

      # ============================================================
      # BBR (backport de mainline 4.9 a este 4.4.302 + MPTCP de Samsung)
      # Parche UNICO embebido (gzip+base64: el editor web no puede alterar
      # tabs/espacios). Se aplica PRIMERO, sobre el upstream pristino, antes
      # de cualquier otro cambio del workflow. Verificado compilando
      # net/ipv4, net/mptcp, skbuff, tcp_ipv6 y sch_fq con GCC 6.4.1.
      # Que incluye: serie de rate-sampling/cong_control de Google (4.6-4.9),
      # tcp_rate.c, tcp_bbr.c, win_minmax, tp->lost, ICSK_CA_PRIV_SIZE 88 y
      # skb->cb 72 (el estado de BBR va FUERA de la union de MPTCP).
      # BBR queda disponible pero NO es el default (sigue cubic+fq):
      #   net-boost-mode.sh bbr   (cc bbr + qdisc fq en wlan0)
      # ============================================================

      - name: Apply BBR backport (embedded patch)
        working-directory: kernel
        run: |
          TMP="${RUNNER_TEMP:-/tmp}"
          base64 -d <<'BBR_B64' | gunzip > "$TMP/bbr-backport.patch"
