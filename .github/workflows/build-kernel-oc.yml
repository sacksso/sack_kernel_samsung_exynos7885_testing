name: 🔥 Build Kernel OC Definitivo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout del kernel
        uses: actions/checkout@v4
        with:
          repository: sacksso/sack_kernel_samsung_exynos7885_testing
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      - name: Checkout toolchain
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses-dev git-core zip \
            gcc-arm-linux-gnueabi perl python3

      # ============================================================
      # PARCHES DE COMPILACIÓN (OBLIGATORIOS)
      # ============================================================
      - name: Parches de compilación
        working-directory: kernel
        run: |
          sed -i 's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' drivers/video/fbdev/exynos/dpu_7885/decon_reg.c
          sed -i 's/if (strlen(CONFIG_HMP_FAST_CPU_MASK)) (strlen(CONFIG_HMP_SLOW_CPU_MASK)); {/if (strlen(CONFIG_HMP_FAST_CPU_MASK) \&\& strlen(CONFIG_HMP_SLOW_CPU_MASK)) {/' arch/arm64/kernel/topology.c
          sed -i 's/char country_code\[SLSI_COUNTRY_CODE_LEN\];/char country_code[SLSI_COUNTRY_CODE_LEN] = {0};/' drivers/net/wireless/scsc/nl80211_vendor.c

      # ============================================================
      # PARCHE de exynos-acme.c: Eliminar función problemática y añadir OC
      # ============================================================
      - name: Parchear exynos-acme.c
        working-directory: kernel
        run: |
          ACME="drivers/cpufreq/exynos-acme.c"
          # Usamos sed para eliminar la función problemática completa
          # y su referencia en el notifier_block
          sed -i '/^static int exynos_thermal_override_notifier/,/^}/d' "$ACME"
          sed -i '/\.notifier_call = exynos_thermal_override_notifier,/d' "$ACME"
          # Marcar funciones no usadas
          sed -i 's/^static int scale(/static int __maybe_unused scale(/' "$ACME"
          sed -i 's/^static int index_to_freq(/static int __maybe_unused index_to_freq(/' "$ACME"
          # Añadir el override de frecuencias al final del archivo
          cat >> "$ACME" << 'EOF'

          /*** OVERRIDE DE FRECUENCIAS PARA OC ***/
          static int __init exynos_oc_patch(void)
          {
              struct exynos_cpufreq_domain *domain;
              list_for_each_entry(domain, &domains, list) {
                  if (domain->id == 0) {
                      domain->max_freq = 1690000;
                      domain->min_freq = 208000;
                      pr_info("CPU LITTLE max_freq forzado a 1690 MHz\n");
                  } else if (domain->id == 1) {
                      domain->max_freq = 2288000;
                      domain->min_freq = 728000;
                      pr_info("CPU BIG max_freq forzado a 2288 MHz\n");
                  }
              }
              return 0;
          }
          late_initcall(exynos_oc_patch);
          EOF
          echo "✅ exynos-acme.c parcheado con éxito"
          tail -30 "$ACME"

      # ============================================================
      # GPU: Tabla real de 5 niveles (máximo 1196 MHz)
      # ============================================================
      - name: Aplicar tabla real de GPU
        working-directory: kernel
        run: |
          MALI_DTS=$(find arch/arm64/boot/dts -name "exynos7885-mali.dtsi" | head -1)
          if [ -z "$MALI_DTS" ]; then
            echo "❌ ERROR: No se encontró exynos7885-mali.dtsi"
            exit 1
          fi
          perl -0777 -pi -e '
            s/gpu_dvfs_table\s*=\s*<[^>]*>;/gpu_dvfs_table = <
              1196000 98 100 1 1794000 1586000 0
               949000 95 100 1 1794000 1586000 0
               747500 90 100 1 1352000  757000 0
               550333 85  95 1  676000  757000 0
               301000 70  90 1  420000  449000 0
            >;/s;
            s/gpu_max_clock\s*=\s*<[^>]*>;/gpu_max_clock = <1196000>;/;
            s/gpu_max_clock_limit\s*=\s*<[^>]*>;/gpu_max_clock_limit = <1196000>;/;
          ' "$MALI_DTS"
          echo "✅ GPU configurada con niveles reales"

      # ============================================================
      # COMPILACIÓN CON -k (ignorar errores de DTS)
      # ============================================================
      - name: Compilar kernel (ignorando errores de DTB)
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export KCFLAGS="-Wno-error=misleading-indentation"
          make O=out lineage_a7y18lte_defconfig
          # La bandera -k (--keep-going) hace que make continúe aunque algunos targets fallen
          make O=out -j"$(nproc)" KCFLAGS="$KCFLAGS" -k

      - name: Verificar y copiar Image
        working-directory: kernel
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ ERROR: No se generó Image"
            exit 1
          fi
          echo "✅ Image generado correctamente"
          ls -lh out/arch/arm64/boot/Image

      # ============================================================
      # EMPAQUETADO CON AnyKernel3
      # ============================================================
      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: sacksso/AnyKernel3-a7y18lte
          path: anykernel3
          fetch-depth: 1

      - name: Copiar Image y crear build-info
        run: |
          cp kernel/out/arch/arm64/boot/Image anykernel3/Image
          cat > anykernel3/build-info.txt << 'EOF'
          ============================================================
          Kernel OC Definitivo para a7y18lte
          ============================================================
          CPU LITTLE: 1690 MHz (Cortex-A53)
          CPU BIG:    2288 MHz (Cortex-A73)
          GPU:        1196 MHz (Mali-G71 MP2, techo real)
          ============================================================
          Verificación post-flasheo:
            cat /sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq
            cat /sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq
            cat /sys/kernel/gpu/gpu_max_clock
          ============================================================
          EOF

      - name: Crear ZIP flasheable
        run: |
          cd anykernel3
          zip -r9 ../kernel-oc-definitivo.zip . -x "*.git*"
          cd ..
          echo "✅ ZIP creado: kernel-oc-definitivo.zip"

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-oc-definitivo
          path: kernel-oc-definitivo.zip
          if-no-files-found: error
