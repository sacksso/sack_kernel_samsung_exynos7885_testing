name: 🔥 Build Kernel OC (LITTLE 1690 + BIG 2288 + GPU 1196) + AnyKernel3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ============================================================
      # CHECKOUTS
      # ============================================================
      - name: Checkout del kernel
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      - name: Checkout toolchain GCC 6.4.1
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      # ============================================================
      # DEPENDENCIAS
      # ============================================================
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses-dev git-core zip \
            gcc-arm-linux-gnueabi perl

      # ============================================================
      # PARCHES DE COMPILACIÓN (OBLIGATORIOS)
      # ============================================================
      - name: Fix decon_clocks_table
        working-directory: kernel
        run: |
          sed -i 's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' drivers/video/fbdev/exynos/dpu_7885/decon_reg.c

      - name: Fix topology.c warning
        working-directory: kernel
        run: |
          sed -i 's/if (strlen(CONFIG_HMP_FAST_CPU_MASK)) (strlen(CONFIG_HMP_SLOW_CPU_MASK)); {/if (strlen(CONFIG_HMP_FAST_CPU_MASK) \&\& strlen(CONFIG_HMP_SLOW_CPU_MASK)) {/' arch/arm64/kernel/topology.c

      - name: Fix nl80211 country_code
        working-directory: kernel
        run: |
          sed -i 's/char country_code\[SLSI_COUNTRY_CODE_LEN\];/char country_code[SLSI_COUNTRY_CODE_LEN] = {0};/' drivers/net/wireless/scsc/nl80211_vendor.c

      # ============================================================
      # OVERCLOCK CPU: LITTLE 1690 MHz + BIG 2288 MHz
      # ============================================================
      - name: Apply CPU overclock (LITTLE 1690, BIG 2288) in exynos-acme.c
        working-directory: kernel
        run: |
          perl -0777 -pi -e '
          s/domain->max_freq = cal_dfs_get_max_freq\(domain->cal_id\);\s*domain->min_freq = cal_dfs_get_min_freq\(domain->cal_id\);/if (domain->id == 0) {\n\t\tdomain->max_freq = 1690000;\n\t\tdomain->min_freq = 208000;\n\t} else if (domain->id == 1) {\n\t\tdomain->max_freq = 2288000;\n\t\tdomain->min_freq = 728000;\n\t} else {\n\t\tdomain->max_freq = cal_dfs_get_max_freq(domain->cal_id);\n\t\tdomain->min_freq = cal_dfs_get_min_freq(domain->cal_id);\n\t}/s
          ' drivers/cpufreq/exynos-acme.c
          echo "✅ Overclock CPU aplicado: LITTLE → 1690 MHz, BIG → 2288 MHz"
          grep -A12 "domain->id" drivers/cpufreq/exynos-acme.c

      # ============================================================
      # CORRECCIÓN DE GPU: tabla real de 5 niveles (máximo 1196 MHz)
      # ============================================================
      - name: Aplicar tabla real de GPU (5 niveles, máximo 1196000 kHz)
        working-directory: kernel
        run: |
          MALI_DTS=$(find arch/arm64/boot/dts -name "exynos7885-mali.dtsi" | head -1)
          if [ -z "$MALI_DTS" ]; then
            echo "❌ ERROR: No se encontró exynos7885-mali.dtsi"
            exit 1
          fi
          echo "📄 Modificando $MALI_DTS"

          perl -0777 -pi -e '
            s/gpu_dvfs_table\s*=\s*<[^>]*>;/gpu_dvfs_table = <
              1196000 98 100 1 1794000 1586000 0
               949000 95 100 1 1794000 1586000 0
               747500 90 100 1 1352000  757000 0
               550333 85  95 1  676000  757000 0
               301000 70  90 1  420000  449000 0
            >;/s;
            s/gpu_max_clock\s*=\s*<[^>]*>;/gpu_max_clock = <1196000>;/;
            s/gpu_max_clock_limit\s*=\s*<[^>]*>;/gpu_max_clock_limit = <1196000>;/;
          ' "$MALI_DTS"

          echo "✅ GPU configurada con niveles reales: 1196000, 949000, 747500, 550333, 301000"
          echo "   Máximo: 1196000 kHz (1.196 GHz)"
          grep -A8 "gpu_dvfs_table" "$MALI_DTS"

      # ============================================================
      # COMPILACIÓN
      # ============================================================
      - name: Compilar kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export KCFLAGS="-Wno-error=misleading-indentation"
          make O=out lineage_a7y18lte_defconfig
          make O=out -j"$(nproc)" KCFLAGS="$KCFLAGS"

      # ============================================================
      # VERIFICAR IMAGE
      # ============================================================
      - name: Verificar Image
        working-directory: kernel
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ ERROR: No se generó Image"
            exit 1
          fi
          echo "✅ Image generado correctamente"
          ls -lh out/arch/arm64/boot/Image*

      # ============================================================
      # EMPAQUETADO CON AnyKernel3
      # ============================================================
      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: sacksso/AnyKernel3-a7y18lte
          path: anykernel3
          fetch-depth: 1

      - name: Copiar Image a AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image anykernel3/Image
          echo "Image copiado correctamente a AnyKernel3"

      - name: Crear build-info.txt
        run: |
          cat > anykernel3/build-info.txt << 'EOF'
          ========================================
          a7y18lte Kernel con OC real (CPU + GPU)
          ========================================
          Dispositivo: Samsung Galaxy A7 2018 (a7y18lte)
          Modelo: SM-A750F/FN/G
          Kernel: Linux 4.4.302
          Compilador: GCC 6.4.1
          Fecha: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Commit: $(git --git-dir=kernel/.git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          ========================================
          Overclocks aplicados:
            CPU LITTLE (Cortex-A53): 1690 MHz (empírico)
            CPU BIG   (Cortex-A73): 2288 MHz (prueba, supera ASV)
            GPU (Mali-G71 MP2):     1196 MHz (techo físico real)
          ========================================
          Este ZIP contiene el kernel con overclock para pruebas.
          ========================================
          EOF
          cat anykernel3/build-info.txt

      - name: Crear ZIP flasheable
        run: |
          cd anykernel3
          zip -r9 ../kernel-oc-big2288.zip . -x "*.git*"
          cd ..
          echo "✅ ZIP creado: kernel-oc-big2288.zip"

      # ============================================================
      # SUBIR ARTIFACT
      # ============================================================
      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-oc-big2288
          path: kernel-oc-big2288.zip
          if-no-files-found: error
