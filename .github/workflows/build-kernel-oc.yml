name: Build Kernel for a7y18lte - OVERCLOCK SEGURO (ASV-based)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout del kernel
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      - name: Checkout toolchain GCC 6.4.1
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses-dev git-core zip \
            gcc-arm-linux-gnueabi

      # ============================================================
      # PARCHES DE COMPILACIÓN (obligatorios)
      # ============================================================
      - name: Corregir decon_clocks_table
        working-directory: kernel
        run: |
          sed -i 's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' drivers/video/fbdev/exynos/dpu_7885/decon_reg.c

      - name: Corregir topology.c
        working-directory: kernel
        run: |
          sed -i 's/if (strlen(CONFIG_HMP_FAST_CPU_MASK)) (strlen(CONFIG_HMP_SLOW_CPU_MASK)); {/if (strlen(CONFIG_HMP_FAST_CPU_MASK) \&\& strlen(CONFIG_HMP_SLOW_CPU_MASK)) {/' arch/arm64/kernel/topology.c

      - name: Corregir nl80211_vendor.c
        working-directory: kernel
        run: |
          sed -i 's/char country_code\[SLSI_COUNTRY_CODE_LEN\];/char country_code[SLSI_COUNTRY_CODE_LEN] = {0};/' drivers/net/wireless/scsc/nl80211_vendor.c

      # ============================================================
      # LOCALIZAR EL ARCHIVO DTS DE CPU
      # ============================================================
      - name: Localizar archivo DTS de CPU
        working-directory: kernel
        id: find_dts
        run: |
          # Buscar el archivo que contiene la frecuencia 2184 MHz
          DTS_FILE=$(find arch/arm64/boot/dts -type f -name "*.dts*" -exec grep -l "2184000000" {} \; | head -1)
          if [ -z "$DTS_FILE" ]; then
            echo "❌ No se encontró el archivo DTS con la frecuencia 2184 MHz"
            exit 1
          fi
          echo "✅ Archivo DTS encontrado: $DTS_FILE"
          echo "DTS_FILE=$DTS_FILE" >> $GITHUB_ENV

      # ============================================================
      # APLICAR OVERCLOCK EN EL ARCHIVO ENCONTRADO
      # ============================================================
      - name: Aplicar overclock ASV-based en CPU big (2288 MHz)
        working-directory: kernel
        run: |
          FILE="${{ env.DTS_FILE }}"
          sed -i '/opp-2184000000 {/i\
          opp-2288000000 {\
              opp-hz = /bits/ 64 <2288000000>;\
              opp-microvolt = <0>;\
              clock-latency-ns = <200000>;\
          };' "$FILE"
          echo "✅ Overclock ASV-based aplicado: CPU BIG 2288 MHz en $FILE"

      # (Opcional) Repetir para little y GPU si se desea, pero asegúrate de localizar también esos archivos.

      # ============================================================
      # COMPILACIÓN
      # ============================================================
      - name: Compilar kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export KCFLAGS="-Wno-error=misleading-indentation"

          make O=out lineage_a7y18lte_defconfig
          make O=out -j"$(nproc)" KCFLAGS="$KCFLAGS"

      - name: Verificar salida
        working-directory: kernel
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ ERROR: No se generó Image"
            exit 1
          fi
          echo "✅ Image generado correctamente"

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: a7y18lte-kernel-oc
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
          if-no-files-found: error
