name: Build Kernel OC Clean (GPU 1300 only, CPU stock)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ============================================================
      # CHECKOUTS
      # ============================================================
      - name: Checkout del kernel
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      - name: Checkout toolchain GCC 6.4.1
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      # ============================================================
      # DEPENDENCIAS
      # ============================================================
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            git-core \
            zip \
            gcc-arm-linux-gnueabi \
            python3

      # ============================================================
      # 1ï¸âƒ£ PARCHES DE COMPILACIÃ“N (OBLIGATORIOS - sin cambios, no tocan OC)
      # ============================================================
      - name: Fix decon_clocks_table
        working-directory: kernel
        run: |
          sed -i 's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' drivers/video/fbdev/exynos/dpu_7885/decon_reg.c
          grep -n "decon_clocks_table\[\]\[CLK_ID_MAX\]" drivers/video/fbdev/exynos/dpu_7885/decon_reg.c

      - name: Fix topology.c warning
        working-directory: kernel
        run: |
          sed -i 's/if (strlen(CONFIG_HMP_FAST_CPU_MASK)) (strlen(CONFIG_HMP_SLOW_CPU_MASK)); {/if (strlen(CONFIG_HMP_FAST_CPU_MASK) \&\& strlen(CONFIG_HMP_SLOW_CPU_MASK)) {/' arch/arm64/kernel/topology.c

      - name: Fix nl80211 country_code
        working-directory: kernel
        run: |
          sed -i 's/char country_code\[SLSI_COUNTRY_CODE_LEN\];/char country_code[SLSI_COUNTRY_CODE_LEN] = {0};/' drivers/net/wireless/scsc/nl80211_vendor.c

      # ============================================================
      # 2ï¸âƒ£ CPU: SIN CAMBIOS - queda 100% stock (LITTLE 1586, BIG 2184)
      # ============================================================
      # Se sacÃ³ el parche que forzaba domain->max_freq a 1690000 para
      # LITTLE. Motivo: confirmado con uso real que esa frecuencia
      # falla (cuelgue al despertar) cuando el equipo estÃ¡ caliente
      # despuÃ©s de jugar. La entrada de esa frecuencia sÃ­ existe en la
      # tabla de calibraciÃ³n real del chip (por eso llegaba a
      # alcanzarse), pero el margen de voltaje que trae esa entrada no
      # estÃ¡ validado por Samsung para el rango tÃ©rmico real de uso -
      # es la explicaciÃ³n mÃ¡s consistente con el fallo reproducible
      # que se observÃ³. No se reintenta hasta probar de a pasos chicos
      # con pruebas de estrÃ©s tÃ©rmico reales.

      # ============================================================
      # 3ï¸âƒ£ OVERCLOCK GPU (Device Tree) - el Ãºnico OC que se mantiene
      # ============================================================
      # 1300000 ya es una fila real de gpu_dvfs_table en el .dtsi de
      # fÃ¡brica (junto con su fila de umbrales de carga/mif original,
      # sin tocar), el voltaje sale del mecanismo de calibraciÃ³n real
      # del chip (cal_dfs_get_rate_asv_table), y no se reportÃ³ ningÃºn
      # fallo con esto activado solo.
      - name: Apply GPU overclock in Device Tree
        working-directory: kernel
        run: |
          MALI_DTS=$(find arch/arm64/boot/dts -name "exynos7885-mali.dtsi" | head -1)
          if [ -z "$MALI_DTS" ]; then
            echo "âŒ ERROR: No se encontrÃ³ exynos7885-mali.dtsi"
            exit 1
          fi
          echo "Modificando $MALI_DTS"
          sed -i 's/gpu_max_clock = <[0-9]*>;/gpu_max_clock = <1300000>;/' "$MALI_DTS"
          sed -i 's/gpu_max_clock_limit = <[0-9]*>;/gpu_max_clock_limit = <1300000>;/' "$MALI_DTS"
          echo "--- VerificaciÃ³n de que el sed realmente aplicÃ³ ---"
          if ! grep -q "gpu_max_clock = <1300000>;" "$MALI_DTS"; then
            echo "âŒ ERROR: gpu_max_clock no quedÃ³ en 1300000, el sed no matcheÃ³"
            exit 1
          fi
          if ! grep -q "gpu_max_clock_limit = <1300000>;" "$MALI_DTS"; then
            echo "âš ï¸ ADVERTENCIA: gpu_max_clock_limit no quedÃ³ en 1300000 (puede no existir esa propiedad en este .dtsi, revisar salida de abajo)"
          fi
          grep -n "gpu_max_clock" "$MALI_DTS"
          echo "âœ… GPU max clock cambiado a 1300000 en Device Tree"

      # ============================================================
      # (sacados) Los 3 parches que forzaban platform->gpu_max_clock a
      # mano en gpu_control.c / gpu_dvfs_handler.c / mali_kbase_platform.c
      # sobraban: el cambio del device tree de arriba ya alcanza, el
      # propio driver arma la tabla real (frecuencia+voltaje) leyendo
      # el .dtsi contra la calibraciÃ³n del chip - forzarlo a mano en 3
      # archivos distintos solo agregaba rutas de cÃ³digo redundantes
      # sin necesidad.
      # ============================================================

      # ============================================================
      # 4ï¸âƒ£ Thermal throttling mÃ¡s temprano (65Â°C en vez de 70Â°C)
      # ============================================================
      # Se mantiene: es inofensivo por sÃ­ solo y le da margen extra al
      # overclock de GPU que sÃ­ queda activo.
      - name: Apply Thermal Tweaks (throttling mÃ¡s temprano)
        working-directory: kernel
        run: |
          THERMAL_DTS=$(find arch/arm64/boot/dts -name "exynos7885-thermal.dtsi" | head -1)
          if [ -z "$THERMAL_DTS" ]; then
            echo "âš ï¸ No se encontrÃ³ exynos7885-thermal.dtsi, saltando..."
            exit 0
          fi
          echo "Modificando $THERMAL_DTS"
          echo "--- Ocurrencias ANTES del cambio (para confirmar alcance real) ---"
          grep -n "temperature = <70000>;\|temperature = <75000>;" "$THERMAL_DTS" || echo "(ninguna coincidencia con esos valores exactos)"
          sed -i '/cooling-maps/,/thermal-sensors/ s/temperature = <70000>/temperature = <65000>/' "$THERMAL_DTS"
          sed -i '/cooling-maps/,/thermal-sensors/ s/temperature = <75000>/temperature = <70000>/' "$THERMAL_DTS"
          echo "--- Ocurrencias DESPUÃ‰S del cambio ---"
          grep -n "temperature = <65000>;\|temperature = <70000>;" "$THERMAL_DTS" || echo "(ninguna coincidencia, el sed pudo no haber aplicado)"
          echo "âœ… Thermal throttling mÃ¡s temprano (65Â°C en vez de 70Â°C)"

      # ============================================================
      # (sacados) SuspensiÃ³n mÃ¡s suave, gobernador menos agresivo,
      # desacoplar voltaje GPU/CPU, margen de voltaje +25mV para
      # LITTLE, y la tabla mif-perf recortada "sin 2288" - todos
      # existÃ­an para enmascarar o compensar el overclock de CPU que
      # ya no estÃ¡. Sin esa frecuencia activa, no hacen falta, y el
      # de +25mV en particular era el mÃ¡s arriesgado de todos (subir
      # voltaje a mano aumenta el calor generado, pudiendo empeorar
      # justo el problema tÃ©rmico que causaba el cuelgue).
      # ============================================================

      # ============================================================
      # 5ï¸âƒ£ COMPILACIÃ“N
      # ============================================================
      # KCFLAGS="-Wno-error" (amplio, sin especificar warning): ya
      # arreglamos topology.c y nl80211 en el cÃ³digo fuente (arriba),
      # pero dejamos la supresiÃ³n amplia como red de seguridad. Sin
      # ella, no hay garantÃ­a de que no exista un tercer warning-as-
      # error en algÃºn otro rincÃ³n del Ã¡rbol (~15 drivers de charger,
      # wifi, cÃ¡mara, etc.) que la supresiÃ³n amplia venÃ­a tapando en
      # los builds anteriores que sÃ­ llegaron completos.
      - name: Compilar kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export KCFLAGS="-Wno-error"
          make O=out lineage_a7y18lte_defconfig
          make O=out -j"$(nproc)" KCFLAGS="$KCFLAGS"

      # ============================================================
      # 6ï¸âƒ£ VERIFICAR SALIDA
      # ============================================================
      - name: Verificar Image
        working-directory: kernel
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "âŒ ERROR: No se generÃ³ Image"
            exit 1
          fi
          echo "âœ… Image generado correctamente"
          ls -lh out/arch/arm64/boot/Image*

      # ============================================================
      # 7ï¸âƒ£ EMPAQUETADO CON AnyKernel3
      # ============================================================
      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: sacksso/AnyKernel3-a7y18lte
          path: anykernel3
          fetch-depth: 1

      - name: Copiar Image a AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image anykernel3/Image
          echo "Image copiado correctamente a AnyKernel3"

      - name: Crear build-info.txt
        run: |
          BUILD_DATE="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          cat > anykernel3/build-info.txt << EOF
          ============================================================
          ðŸš€ a7y18lte OC Kernel - GPU only (CPU stock)
          ============================================================
          Dispositivo: Samsung Galaxy A7 2018 (a7y18lte)
          Modelo: SM-A750F/FN/G
          Kernel: Linux 4.4.302
          Compilador: GCC 6.4.1
          Fecha: ${BUILD_DATE}
          ============================================================
          ðŸ“Š OVERCLOCK APLICADO
          CPU LITTLE (Cortex-A53): 1586 MHz (stock - revertido)
          CPU BIG (Cortex-A73): 2184 MHz (stock - sin overclock)
          GPU (Mali-G71 MP2): 1300 MHz (stock 1100 MHz) ðŸŽ®
          ============================================================
          ðŸ“ NOTA
          El overclock de CPU LITTLE a 1690MHz se revirtiÃ³: causaba
          cuelgue reproducible al despertar la pantalla con el equipo
          caliente tras uso prolongado. El de GPU se mantiene porque
          no presentÃ³ ese problema y su frecuencia estÃ¡ respaldada por
          una entrada real de la tabla de fÃ¡brica.
          ============================================================
          ðŸ”¥ AJUSTES QUE SE MANTIENEN
          1. Thermal throttling mÃ¡s temprano: 65Â°C en vez de 70Â°C
          ============================================================
          ðŸ“‹ INSTRUCCIONES
          - Flashear este ZIP desde TWRP
          - Hacer wipe cache/dalvik despuÃ©s de flashear
          - Verificar frecuencias con CPU-Z o DevCheck
          ============================================================
          EOF
          cat anykernel3/build-info.txt

      - name: Crear ZIP flasheable
        run: |
          cd anykernel3
          zip -r9 ../a7y18lte-OC-GPU-only.zip . -x "*.git*"
          cd ..
          echo "âœ… ZIP creado correctamente"
          ls -lh a7y18lte-OC-GPU-only.zip

      # ============================================================
      # 8ï¸âƒ£ SUBIR ARTIFACT
      # ============================================================
      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: a7y18lte-OC-GPU-only
          path: a7y18lte-OC-GPU-only.zip
          if-no-files-found: error
