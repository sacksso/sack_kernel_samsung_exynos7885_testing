name: 🔥 Build Kernel OC Definitivo (LITTLE 1690, BIG 2288, GPU 1196)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ============================================================
      # CHECKOUTS
      # ============================================================
      - name: Checkout del kernel (TU REPOSITORIO)
        uses: actions/checkout@v4
        with:
          repository: sacksso/sack_kernel_samsung_exynos7885_testing
          ref: lineage-18.1   # ← CAMBIADO: usa la rama correcta
          path: kernel
          fetch-depth: 1

      - name: Checkout toolchain GCC 6.4.1
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      # ============================================================
      # DEPENDENCIAS
      # ============================================================
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses-dev git-core zip \
            gcc-arm-linux-gnueabi perl

      # ============================================================
      # PARCHES DE COMPILACIÓN (OBLIGATORIOS)
      # ============================================================
      - name: Fix decon_clocks_table
        working-directory: kernel
        run: |
          sed -i 's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' drivers/video/fbdev/exynos/dpu_7885/decon_reg.c

      - name: Fix topology.c warning
        working-directory: kernel
        run: |
          sed -i 's/if (strlen(CONFIG_HMP_FAST_CPU_MASK)) (strlen(CONFIG_HMP_SLOW_CPU_MASK)); {/if (strlen(CONFIG_HMP_FAST_CPU_MASK) \&\& strlen(CONFIG_HMP_SLOW_CPU_MASK)) {/' arch/arm64/kernel/topology.c

      - name: Fix nl80211 country_code
        working-directory: kernel
        run: |
          sed -i 's/char country_code\[SLSI_COUNTRY_CODE_LEN\];/char country_code[SLSI_COUNTRY_CODE_LEN] = {0};/' drivers/net/wireless/scsc/nl80211_vendor.c

      # ============================================================
      # OVERCLOCK CPU: LITTLE 1690 + BIG 2288 (exynos-acme.c)
      # ============================================================
      - name: Aplicar overclock CPU (LITTLE 1690, BIG 2288) en exynos-acme.c
        working-directory: kernel
        run: |
          perl -0777 -pi -e '
          s/domain->max_freq = cal_dfs_get_max_freq\(domain->cal_id\);\s*domain->min_freq = cal_dfs_get_min_freq\(domain->cal_id\);/if (domain->id == 0) {\n\t\tdomain->max_freq = 1690000;\n\t\tdomain->min_freq = 208000;\n\t} else if (domain->id == 1) {\n\t\tdomain->max_freq = 2288000;\n\t\tdomain->min_freq = 728000;\n\t} else {\n\t\tdomain->max_freq = cal_dfs_get_max_freq(domain->cal_id);\n\t\tdomain->min_freq = cal_dfs_get_min_freq(domain->cal_id);\n\t}/s
          ' drivers/cpufreq/exynos-acme.c
          echo "✅ Overclock CPU aplicado: LITTLE → 1690 MHz, BIG → 2288 MHz"
          grep -A12 "domain->id" drivers/cpufreq/exynos-acme.c

      # ============================================================
      # MODIFICAR DEVICE TREE (eliminar max-freq para priorizar código)
      # ============================================================
      - name: Eliminar max-freq de los dominios cpufreq en el DTS
        working-directory: kernel
        run: |
          DTS_FILE="arch/arm64/boot/dts/exynos/exynos7885.dtsi"
          if [ -f "$DTS_FILE" ]; then
            sed -i '/domain@0 {/,/};/ s/^\s*max-freq = .*;//' "$DTS_FILE"
            sed -i '/domain@1 {/,/};/ s/^\s*max-freq = .*;//' "$DTS_FILE"
            echo "✅ max-freq eliminados del DTS"
          fi

      # ============================================================
      # CORRECCIÓN DE GPU: tabla real de 5 niveles (máximo 1196 MHz)
      # ============================================================
      - name: Aplicar tabla real de GPU (5 niveles, máximo 1196000 kHz)
        working-directory: kernel
        run: |
          MALI_DTS=$(find arch/arm64/boot/dts -name "exynos7885-mali.dtsi" | head -1)
          if [ -z "$MALI_DTS" ]; then
            echo "❌ ERROR: No se encontró exynos7885-mali.dtsi"
            exit 1
          fi
          perl -0777 -pi -e '
            s/gpu_dvfs_table\s*=\s*<[^>]*>;/gpu_dvfs_table = <
              1196000 98 100 1 1794000 1586000 0
               949000 95 100 1 1794000 1586000 0
               747500 90 100 1 1352000  757000 0
               550333 85  95 1  676000  757000 0
               301000 70  90 1  420000  449000 0
            >;/s;
            s/gpu_max_clock\s*=\s*<[^>]*>;/gpu_max_clock = <1196000>;/;
            s/gpu_max_clock_limit\s*=\s*<[^>]*>;/gpu_max_clock_limit = <1196000>;/;
          ' "$MALI_DTS"
          echo "✅ GPU configurada con niveles reales: 1196000, 949000, 747500, 550333, 301000"

      # ============================================================
      # CONFIGURACIÓN DE ESTABILIDAD (Quantum Quack style)
      # ============================================================
      - name: Añadir opciones de estabilidad al defconfig
        working-directory: kernel
        run: |
          DEFCONFIG=$(find arch/arm64/configs -name "*a7y18lte*" | head -1)
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG=$(find arch/arm64/configs -name "exynos7885*" | head -1)
          fi
          if [ -z "$DEFCONFIG" ]; then
            echo "❌ ERROR: No se encontró defconfig"
            exit 1
          fi
          echo "📝 Modificando $DEFCONFIG"
          # Habilitar Power Efficient Workqueue
          if ! grep -q "CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y" "$DEFCONFIG"; then
            echo "CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y" >> "$DEFCONFIG"
          fi
          # Desactivar auditoría y trace_printk (reducen sobrecarga)
          sed -i 's/^CONFIG_AUDIT=y/# CONFIG_AUDIT is not set/' "$DEFCONFIG"
          sed -i 's/^CONFIG_TRACE_PRINTK=y/# CONFIG_TRACE_PRINTK is not set/' "$DEFCONFIG"
          # Añadir parámetros de arranque
          if ! grep -q "CONFIG_CMDLINE=" "$DEFCONFIG"; then
            echo 'CONFIG_CMDLINE="cpu_max_c1=1690000 cpu_max_c2=2288000"' >> "$DEFCONFIG"
          else
            sed -i 's/^CONFIG_CMDLINE=.*/CONFIG_CMDLINE="cpu_max_c1=1690000 cpu_max_c2=2288000"/' "$DEFCONFIG"
          fi
          echo "✅ Opciones de estabilidad y parámetros de arranque añadidos"

      # ============================================================
      # COMPILACIÓN
      # ============================================================
      - name: Compilar kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export KCFLAGS="-Wno-error=misleading-indentation"
          make O=out lineage_a7y18lte_defconfig
          make O=out -j"$(nproc)" KCFLAGS="$KCFLAGS"

      # ============================================================
      # VERIFICAR IMAGE
      # ============================================================
      - name: Verificar Image
        working-directory: kernel
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ ERROR: No se generó Image"
            exit 1
          fi
          echo "✅ Image generado correctamente"
          ls -lh out/arch/arm64/boot/Image*

      # ============================================================
      # EMPAQUETADO CON AnyKernel3
      # ============================================================
      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: sacksso/AnyKernel3-a7y18lte
          path: anykernel3
          fetch-depth: 1

      - name: Copiar Image a AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image anykernel3/Image
          echo "Image copiado correctamente"

      - name: Crear build-info.txt con instrucciones
        run: |
          cat > anykernel3/build-info.txt << 'EOF'
          ============================================================
          Kernel OC Definitivo para a7y18lte
          ============================================================
          Fecha: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          ============================================================
          Overclocks aplicados:
            CPU LITTLE (Cortex-A53): 1690 MHz (estable, empírico)
            CPU BIG   (Cortex-A73): 2288 MHz (prueba de estabilidad)
            GPU (Mali-G71 MP2):      1196 MHz (techo físico real)
          ============================================================
          Optimizaciones de estabilidad (estilo Quantum Quack):
            - Power Efficient Workqueue activado
            - Auditoría y trace_printk desactivados
            - Parámetros de arranque añadidos
          ============================================================
          INSTRUCCIONES DE VERIFICACIÓN (después de flashear):
            1. cat /proc/cmdline | grep cpu_max
               Debe mostrar: cpu_max_c1=1690000 cpu_max_c2=2288000
            2. cat /sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq
               Debe mostrar: 1690000
            3. cat /sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq
               Debe mostrar: 2288000
            4. cat /sys/kernel/gpu/gpu_max_clock
               Debe mostrar: 1196000
          ============================================================
          Si ves esos valores, ¡el overclock está funcionando!
          ============================================================
          EOF
          cat anykernel3/build-info.txt

      - name: Crear ZIP flasheable
        run: |
          cd anykernel3
          zip -r9 ../kernel-oc-definitivo.zip . -x "*.git*"
          cd ..
          echo "✅ ZIP creado: kernel-oc-definitivo.zip"

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-oc-definitivo
          path: kernel-oc-definitivo.zip
          if-no-files-found: error
