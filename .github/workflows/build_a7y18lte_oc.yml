name: Build a7y18lte OC Kernel + AnyKernel3

on: workflow_dispatch:

jobs: build: runs-on: ubuntu-22.04 timeout-minutes: 90

    steps:

    - name: Checkout kernel
      uses: actions/checkout@v4
      with:
        repository: sacksso/sack_kernel_samsung_exynos7885_testing
        ref: main
        path: kernel
        fetch-depth: 1

    - name: Checkout GCC 6.4.1
      uses: actions/checkout@v4
      with:
        repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
        ref: lineage-18.1
        path: toolchain/aarch64
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison flex build-essential libssl-dev libncurses-dev zip gcc-arm-linux-gnueabi device-tree-compiler

    - name: Fix decon clocks
      working-directory: kernel
      run: |
        sed -i 's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' drivers/video/fbdev/exynos/dpu_7885/decon_reg.c || true

    - name: Fix nl80211 country
      working-directory: kernel
      run: |
        sed -i 's/char country_code\\[SLSI_COUNTRY_CODE_LEN\\];/char country_code[SLSI_COUNTRY_CODE_LEN] = {0};/' drivers/net/wireless/scsc/nl80211_vendor.c || true

    - name: Apply CPU overclock
      working-directory: kernel
      run: |
        echo "CPU OC patch step"
        perl -0777 -pi -e 's/domain->max_freq = 2184000;/domain->max_freq = 2288000;/g' drivers/cpufreq/exynos-acme.c || true
        perl -0777 -pi -e 's/domain->max_freq = 1586000;/domain->max_freq = 1690000;/g' drivers/cpufreq/exynos-acme.c || true

    - name: Apply GPU overclock
      working-directory: kernel
      run: |
        sed -i 's/gpu_max_clock = <1100000>;/gpu_max_clock = <1300000>;/' arch/arm64/boot/dts/exynos/exynos7885-mali.dtsi
        sed -i 's/gpu_max_clock_limit = <1100000>;/gpu_max_clock_limit = <1300000>;/' arch/arm64/boot/dts/exynos/exynos7885-mali.dtsi

    - name: Verify GPU DTS
      working-directory: kernel
      run: |
        grep gpu_max_clock arch/arm64/boot/dts/exynos/exynos7885-mali.dtsi
        grep 1300000 arch/arm64/boot/dts/exynos/exynos7885-mali.dtsi

    - name: Compile kernel
      working-directory: kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        make O=out lineage_a7y18lte_defconfig
        make O=out -j$(nproc)

    - name: Verify Image
      run: |
        test -f kernel/out/arch/arm64/boot/Image
        ls -lh kernel/out/arch/arm64/boot/Image

    - name: Clone AnyKernel3
      run: |
        git clone --depth=1 https://github.com/sacksso/AnyKernel3-a7y18lte anykernel

    - name: Prepare AnyKernel3
      run: |
        cp kernel/out/arch/arm64/boot/Image anykernel/Image

        test -f anykernel/anykernel.sh
        test -f anykernel/META-INF/com/google/android/update-binary

        cat > anykernel/build-info.txt << EOF

Device: Samsung Galaxy A7 2018 a7y18lte Kernel: 4.4.302 CPU OC: A53
1690000 A73 2288000

GPU: Mali-G71 MP2 1300000 EOF

    - name: Create flashable ZIP
      run: |
        cd anykernel
        zip -r9 ../a7y18lte-OC-Kernel.zip . -x ".git/*" "*.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: a7y18lte-OC-Kernel
        path: a7y18lte-OC-Kernel.zip
