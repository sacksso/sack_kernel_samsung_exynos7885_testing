name: Build Kernel - Clean + decon_reg fix (CFLAGS_REMOVE)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout del kernel (limpio)
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      - name: Checkout toolchain GCC
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses-dev git-core zip \
            gcc-arm-linux-gnueabi

      # ============================================================
      # PARCHE: Quitar -mgeneral-regs-only solo en decon_reg.c
      # Usamos printf para asegurar salto de línea antes y después
      # ============================================================
      - name: Quitar -mgeneral-regs-only solo en decon_reg.c
        working-directory: kernel
        run: |
          printf '\nCFLAGS_REMOVE_decon_reg.o := -mgeneral-regs-only\n' >> drivers/video/fbdev/exynos/dpu_7885/Makefile
          echo "--- Contenido final del Makefile del driver ---"
          cat drivers/video/fbdev/exynos/dpu_7885/Makefile
          echo "--- Confirmando que la línea quedó sola ---"
          grep -n "CFLAGS_REMOVE_decon_reg" drivers/video/fbdev/exynos/dpu_7885/Makefile

      # ============================================================
      # COMPILACIÓN
      # ============================================================
      - name: Compilar kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export KCFLAGS="-Wno-error"

          make O=out lineage_a7y18lte_defconfig
          make O=out -j"$(nproc)" KCFLAGS="$KCFLAGS"

      # ============================================================
      # VERIFICACIÓN DE SEGURIDAD: confirmar que decon_reg.o no
      # contiene instrucciones NEON/FP reales
      # ============================================================
      - name: Verificar ausencia de instrucciones NEON/FP reales
        working-directory: kernel
        run: |
          OBJDUMP="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-objdump"
          OBJFILE=$(find out -name 'decon_reg.o' | head -1)
          echo "Revisando: $OBJFILE"
          if $OBJDUMP -d "$OBJFILE" | grep -Ei '\b(fmov|fadd|fsub|fmul|fdiv|fcmp|ldr[[:space:]]+q|str[[:space:]]+q|[[:space:]]v[0-9]+\.)\b'; then
            echo "❌ Se encontraron instrucciones NEON/FP reales en decon_reg.o — NO continuar"
            exit 1
          else
            echo "✅ decon_reg.o no usa NEON/FP real — confirmado que era solo el falso positivo del compilador"
          fi

      # ============================================================
      # VERIFICAR Image.gz-dtb
      # ============================================================
      - name: Verificar Image.gz-dtb
        working-directory: kernel
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "ERROR: No se generó Image.gz-dtb."
            exit 1
          else
            echo "✅ Image.gz-dtb encontrado."
            ls -la out/arch/arm64/boot/Image*
          fi

      # ============================================================
      # SUBIR ARTIFACT
      # ============================================================
      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: a7y18lte-kernel-clean
          path: kernel/out/arch/arm64/boot/Image*
          if-no-files-found: error
