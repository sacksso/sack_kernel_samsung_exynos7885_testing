name: Build Kernel for a7y18lte - TESTING (schedutil, lz4, cubic, BFQ, WireGuard, BBR, KSM)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ============================================================
      # 1. CHECKOUTS
      # ============================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      - name: Checkout GCC 6.4.1 toolchain
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      - name: Checkout kernel donante (BFQ + WireGuard)
        uses: actions/checkout@v4
        with:
          repository: prashantpaddune/android_kernel_samsung_a7y18lte
          path: donor
          fetch-depth: 1

      # ============================================================
      # 1b. DIAGNÓSTICO (no bloqueante): buscar infraestructura ya
      #     existente en ambos árboles para touch boost y curva térmica,
      #     antes de escribir cualquier parche a ciegas.
      # ============================================================

      - name: Investigate existing input-boost and thermal infrastructure
        run: |
          echo "===== INPUT BOOSTER (touch boost) ====="
          echo "--- kernel propio ---"
          find kernel -iname "*input_boost*" -o -iname "*input_booster*" 2>/dev/null
          grep -rn "INPUT_BOOST\|input_booster\|cpu_input_boost" kernel/arch/arm64/configs/lineage_a7y18lte_defconfig kernel/drivers/Kconfig 2>/dev/null || echo "(sin coincidencias en defconfig/drivers Kconfig)"
          echo "--- donante ---"
          find donor -iname "*input_boost*" -o -iname "*input_booster*" 2>/dev/null || echo "(sin archivos en donante)"

          echo
          echo "===== THERMAL (trip points / step_wise) ====="
          echo "--- kernel propio ---"
          find kernel/drivers/thermal -maxdepth 2 -type f 2>/dev/null
          grep -rln "trip_point\|step_wise\|set_trip_temp" kernel/drivers/thermal 2>/dev/null || echo "(sin coincidencias en drivers/thermal)"
          echo "--- donante ---"
          find donor/drivers/thermal -maxdepth 2 -type f 2>/dev/null || echo "(sin drivers/thermal en donante)"

          echo
          echo "===== INPUT BOOSTER: quién lo usa (call sites) ====="
          echo "--- kernel propio ---"
          grep -rl "input_booster.h\|struct input_booster\|ib_send_event\|input_booster_send_event" kernel/drivers/input 2>/dev/null || echo "(ningún driver de input lo incluye)"

          echo
          echo "--- Kconfig symbol INPUT_BOOSTER o SEC_INPUT_BOOSTER en cualquier parte ---"
          grep -rn "config INPUT_BOOSTER\|config SEC_INPUT_BOOSTER\|SEC_INPUT_BOOSTER" kernel donor 2>/dev/null || echo "(ningún símbolo relacionado existe en ningún árbol)"

          echo
          echo "===== CONTENIDO COMPLETO de kernel/include/linux/input/input_booster.h ====="
          cat kernel/include/linux/input/input_booster.h 2>/dev/null || echo "(el archivo no existe en esta rama/checkout)"
          echo
          echo "===== THERMAL: origen real de los trip points ====="
          echo "--- exynos_tmu.c: valores hardcodeados ---"
          grep -n "trip_temp\|THRESHOLD\|_TEMP \|TMU_DEF\|#define.*TEMP" kernel/drivers/thermal/samsung/exynos_tmu.c 2>/dev/null | head -30
          echo "--- ¿hay exynos_tmu_data.c? ---"
          find kernel/drivers/thermal/samsung -type f
          echo "--- trips/cooling-maps en device tree (exynos7885) ---"
          grep -rl "trips\|cooling-maps\|polling-delay" kernel/arch/arm64/boot/dts/exynos 2>/dev/null | grep -i "7885\|a7y18" || \
            grep -rl "trips\|cooling-maps\|polling-delay" kernel/arch/arm64/boot/dts/exynos 2>/dev/null | head -5
          echo "--- CONFIG_THERMAL en defconfig ---"
          grep -n "CONFIG_THERMAL\|CONFIG_EXYNOS_THERMAL" kernel/arch/arm64/configs/lineage_a7y18lte_defconfig 2>/dev/null

          echo
          echo "===== SCHEDULER: sched_migration_cost_ns / sched_wakeup_granularity_ns ====="
          echo "--- ¿CONFIG_SCHED_DEBUG habilitado? (sin esto los sysctl no existen en runtime) ---"
          grep -n "CONFIG_SCHED_DEBUG" kernel/arch/arm64/configs/lineage_a7y18lte_defconfig 2>/dev/null || echo "(símbolo no encontrado en defconfig)"
          echo "--- valores default en el fuente ---"
          grep -rn "sysctl_sched_migration_cost\s*=\|sysctl_sched_wakeup_granularity\s*=" kernel/kernel/sched/*.c 2>/dev/null

          echo
          echo "===== MEMORIA: watermark_scale_factor y THP ====="
          echo "--- ¿existe watermark_scale_factor en este árbol? (llegó a mainline en 4.6, este kernel es 4.4) ---"
          grep -rln "watermark_scale_factor" kernel/mm kernel/kernel/sysctl.c 2>/dev/null || echo "(no existe - confirmado: feature de kernel 4.6+, no portado a este árbol 4.4)"
          echo "--- CONFIG_TRANSPARENT_HUGEPAGE en defconfig ---"
          grep -n "CONFIG_TRANSPARENT_HUGEPAGE" kernel/arch/arm64/configs/lineage_a7y18lte_defconfig 2>/dev/null
          echo "--- modo default de THP en el fuente ---"
          grep -n "TRANSPARENT_HUGEPAGE_.*_ALWAYS\|transparent_hugepage_flags" kernel/mm/huge_memory.c 2>/dev/null | head -10

          echo
          echo "===== GPU: gobernador DVFS del Mali (umbral de carga) ====="
          find kernel/drivers/gpu/arm -iname "*platform*" -o -iname "*dvfs*" 2>/dev/null | head -20
          grep -rln "upthreshold\|downthreshold\|utilisation\|simple_ondemand" kernel/drivers/gpu/arm 2>/dev/null | head -10
          echo "--- contenido real: umbrales/carga en gpu_dvfs_governor.c ---"
          grep -n "threshold\|utilization\|load\s*[<>]\|#define.*UP\|#define.*DOWN" kernel/drivers/gpu/arm/tMIx/r10p0/platform/exynos/gpu_dvfs_governor.c 2>/dev/null | head -40
          echo "--- ¿otras versiones de driver además de r10p0/r3p0? ---"
          find kernel/drivers/gpu/arm -maxdepth 2 -type d 2>/dev/null
        continue-on-error: true

      # ============================================================
      # 2. DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            git-core \
            zip \
            gcc-arm-linux-gnueabi

      # ============================================================
      # 3. FIXES BASE (obligatorios)
      # ============================================================

      - name: Fix decon_clocks_table
        working-directory: kernel
        run: |
          sed -i 's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' \
            drivers/video/fbdev/exynos/dpu_7885/decon_reg.c
          grep -n "^const unsigned long decon_clocks_table" drivers/video/fbdev/exynos/dpu_7885/decon_reg.c

      - name: Fix topology.c warning
        working-directory: kernel
        run: |
          sed -i 's/if (strlen(CONFIG_HMP_FAST_CPU_MASK)) (strlen(CONFIG_HMP_SLOW_CPU_MASK)); {/if (strlen(CONFIG_HMP_FAST_CPU_MASK) \&\& strlen(CONFIG_HMP_SLOW_CPU_MASK)) {/' \
            arch/arm64/kernel/topology.c
          grep -n "strlen(CONFIG_HMP_FAST_CPU_MASK)" arch/arm64/kernel/topology.c

      - name: Fix nl80211 country_code
        working-directory: kernel
        run: |
          sed -i 's/char country_code\[SLSI_COUNTRY_CODE_LEN\];/char country_code[SLSI_COUNTRY_CODE_LEN] = {0};/' \
            drivers/net/wireless/scsc/nl80211_vendor.c
          grep -n "char country_code\[SLSI_COUNTRY_CODE_LEN\]" drivers/net/wireless/scsc/nl80211_vendor.c

      # ============================================================
      # 4. FIX sched/tune.h
      # ============================================================

      - name: Fix sched/tune.h - forward declare cpufreq_policy and freqvar_boost_data
        working-directory: kernel
        run: |
          ANCHOR='static inline int schedtune_freqvar_boost_init'
          if ! grep -qF "$ANCHOR" kernel/sched/tune.h; then
            echo "ERROR: no se encontró la línea ancla '$ANCHOR' en kernel/sched/tune.h."
            head -n 40 kernel/sched/tune.h
            exit 1
          fi
          if ! grep -q "^struct cpufreq_policy;" kernel/sched/tune.h; then
            sed -i "/$ANCHOR/i struct cpufreq_policy;" kernel/sched/tune.h
          fi
          if ! grep -q "^struct freqvar_boost_data;" kernel/sched/tune.h; then
            sed -i "/$ANCHOR/i struct freqvar_boost_data;" kernel/sched/tune.h
          fi
          grep -n "struct cpufreq_policy;" kernel/sched/tune.h
          grep -n "struct freqvar_boost_data;" kernel/sched/tune.h

      # ============================================================
      # 5. TCP CUBIC (fix: selección de choice)
      # ============================================================

      - name: Set default TCP congestion control to cubic
        working-directory: kernel
        run: |
          DEFCONFIG=arch/arm64/configs/lineage_a7y18lte_defconfig
          # Eliminar selecciones previas de la choice
          sed -i '/^CONFIG_DEFAULT_BIC/d;/^CONFIG_DEFAULT_RENO/d;/^CONFIG_DEFAULT_WESTWOOD/d;/^CONFIG_DEFAULT_VEGAS/d;/^CONFIG_DEFAULT_HTCP/d;/^CONFIG_DEFAULT_TCP_CONG/d' "$DEFCONFIG"
          # Asegurar que cubic esté compilado
          grep -q "^CONFIG_TCP_CONG_CUBIC=y" "$DEFCONFIG" || echo "CONFIG_TCP_CONG_CUBIC=y" >> "$DEFCONFIG"
          # Seleccionar cubic en la choice
          echo "CONFIG_DEFAULT_CUBIC=y" >> "$DEFCONFIG"
          grep -n "CONFIG_DEFAULT_CUBIC\|CONFIG_TCP_CONG_CUBIC" "$DEFCONFIG"

      # ============================================================
      # 6. SCHEDUTIL (compilado + gobernador por defecto)
      # ============================================================

      - name: Enable schedutil governor and set as default
        working-directory: kernel
        run: |
          DEFCONFIG=arch/arm64/configs/lineage_a7y18lte_defconfig
          # Habilitar schedutil
          if grep -q "^# CONFIG_CPU_FREQ_GOV_SCHEDUTIL is not set" "$DEFCONFIG"; then
            sed -i 's/# CONFIG_CPU_FREQ_GOV_SCHEDUTIL is not set/CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y/' "$DEFCONFIG"
          else
            echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" >> "$DEFCONFIG"
          fi
          grep -q "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" "$DEFCONFIG" || { echo "ERROR: schedutil no activado"; exit 1; }
          # Activar FREQVAR_SCHEDTUNE (necesario para cpufreq_schedutil.c)
          if grep -q "^# CONFIG_FREQVAR_SCHEDTUNE is not set" "$DEFCONFIG"; then
            sed -i 's/# CONFIG_FREQVAR_SCHEDTUNE is not set/CONFIG_FREQVAR_SCHEDTUNE=y/' "$DEFCONFIG"
          else
            echo "CONFIG_FREQVAR_SCHEDTUNE=y" >> "$DEFCONFIG"
          fi
          grep -q "CONFIG_FREQVAR_SCHEDTUNE=y" "$DEFCONFIG" || { echo "ERROR: FREQVAR_SCHEDTUNE no activado"; exit 1; }
          # Hacer schedutil el gobernador por defecto (quitar interactive)
          sed -i '/^CONFIG_CPU_FREQ_DEFAULT_GOV_INTERACTIVE/d;/^CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE/d;/^CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND/d;/^CONFIG_CPU_FREQ_DEFAULT_GOV_CONSERVATIVE/d;/^CONFIG_CPU_FREQ_DEFAULT_GOV_POWERSAVE/d;/^CONFIG_CPU_FREQ_DEFAULT_GOV_USERSPACE/d' "$DEFCONFIG"
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y" >> "$DEFCONFIG"
          grep -n "CONFIG_CPU_FREQ_DEFAULT_GOV" "$DEFCONFIG"

      # ============================================================
      # 7. Fix arch_scale_freq_invariant (necesario para schedutil en 4.4)
      # ============================================================

      - name: Fix arch_scale_freq_invariant for schedutil
        working-directory: kernel
        run: |
          FILE=kernel/sched/cpufreq_schedutil.c
          if ! grep -q "^#define arch_scale_freq_invariant" "$FILE"; then
            if ! grep -qF '#include "sched.h"' "$FILE"; then
              echo "ERROR: no se encontró '#include \"sched.h\"' en $FILE"
              head -n 25 "$FILE"
              exit 1
            fi
            sed -i '/^#include "sched.h"/a #ifndef arch_scale_freq_invariant\n#define arch_scale_freq_invariant() false\n#endif' "$FILE"
          fi
          grep -q "^#define arch_scale_freq_invariant" "$FILE" || { echo "ERROR: no se añadió arch_scale_freq_invariant"; exit 1; }

      # ============================================================
      # 7a2. Thermal: trip points escribibles en runtime (confirmado que
      #      vienen del device tree, symbol estándar de Linux, bajo riesgo)
      # ============================================================

      - name: Enable writable thermal trip points
        working-directory: kernel
        run: |
          DEFCONFIG=arch/arm64/configs/lineage_a7y18lte_defconfig
          if grep -q "^# CONFIG_THERMAL_WRITABLE_TRIPS is not set" "$DEFCONFIG"; then
            sed -i 's/# CONFIG_THERMAL_WRITABLE_TRIPS is not set/CONFIG_THERMAL_WRITABLE_TRIPS=y/' "$DEFCONFIG"
          else
            grep -q "^CONFIG_THERMAL_WRITABLE_TRIPS=y" "$DEFCONFIG" || echo "CONFIG_THERMAL_WRITABLE_TRIPS=y" >> "$DEFCONFIG"
          fi
          grep -q "CONFIG_THERMAL_WRITABLE_TRIPS=y" "$DEFCONFIG" || { echo "ERROR: THERMAL_WRITABLE_TRIPS no activado"; exit 1; }
          grep -n "CONFIG_THERMAL_WRITABLE_TRIPS" "$DEFCONFIG"

      # ============================================================
      # 7a3. Transparent Huge Pages: activar (estaba completamente
      #      deshabilitado, symbol estándar de Linux, bajo riesgo)
      # ============================================================

      - name: Enable Transparent Huge Pages
        working-directory: kernel
        run: |
          DEFCONFIG=arch/arm64/configs/lineage_a7y18lte_defconfig
          if grep -q "^# CONFIG_TRANSPARENT_HUGEPAGE is not set" "$DEFCONFIG"; then
            sed -i 's/# CONFIG_TRANSPARENT_HUGEPAGE is not set/CONFIG_TRANSPARENT_HUGEPAGE=y/' "$DEFCONFIG"
          else
            grep -q "^CONFIG_TRANSPARENT_HUGEPAGE=y" "$DEFCONFIG" || echo "CONFIG_TRANSPARENT_HUGEPAGE=y" >> "$DEFCONFIG"
          fi
          grep -q "CONFIG_TRANSPARENT_HUGEPAGE=y" "$DEFCONFIG" || { echo "ERROR: THP no activado"; exit 1; }
          # MISMO PATRÓN QUE CUBIC/SCHEDUTIL: mm/Kconfig tiene una choice
          # separada "Transparent Hugepage Support sysfs defaults" con
          # default TRANSPARENT_HUGEPAGE_ALWAYS. Sin fijarla explícitamente,
          # el build queda en modo "always" (mayor consumo de RAM sin
          # garantía de beneficio) en vez de "madvise" (más seguro, solo
          # apps que lo piden explícitamente lo usan).
          sed -i '/^CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS/d' "$DEFCONFIG"
          echo "CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y" >> "$DEFCONFIG"
          grep -n "CONFIG_TRANSPARENT_HUGEPAGE" "$DEFCONFIG"

      # ============================================================
      # 7a4. FIX: bug real en fs/proc/task_mmu.c, nunca antes compilado
      # ============================================================
      # CONFIRMADO EN BUILD REAL: al activar THP por primera vez en este
      # árbol, reclaim_pte_range() (feature propia de Samsung, no upstream)
      # llama split_huge_page_pmd(vma, pmd, addr) pero la macro espera
      # (vma, address, pmd) - argumentos 2 y 3 invertidos. Con THP siempre
      # desactivado este código jamás se había compilado, por eso el bug
      # nunca se vio. Error real:
      #   fs/proc/task_mmu.c:1570:27: error: passing argument 2 of
      #   '__split_huge_page_pmd' makes integer from pointer without a cast

      - name: Fix swapped arguments in reclaim_pte_range (task_mmu.c)
        working-directory: kernel
        run: |
          FILE=fs/proc/task_mmu.c
          if ! grep -q "split_huge_page_pmd(vma, pmd, addr);" "$FILE"; then
            echo "ERROR: no se encontró la línea esperada en $FILE (¿cambió el código fuente?)"
            grep -n "split_huge_page_pmd" "$FILE"
            exit 1
          fi
          sed -i 's/split_huge_page_pmd(vma, pmd, addr);/split_huge_page_pmd(vma, addr, pmd);/' "$FILE"
          grep -n "split_huge_page_pmd(vma, addr, pmd);" "$FILE" || { echo "ERROR: no se aplicó el fix"; exit 1; }

      # ============================================================
      # 7b. fq qdisc (símbolo ya existente en este árbol 4.4, confirmado
      #     por build anterior - CONFIG_NET_SCH_FQ=y en línea 998)
      # ============================================================

      - name: Enable fq qdisc
        working-directory: kernel
        run: |
          DEFCONFIG=arch/arm64/configs/lineage_a7y18lte_defconfig
          if grep -q "^# CONFIG_NET_SCH_FQ is not set" "$DEFCONFIG"; then
            sed -i 's/# CONFIG_NET_SCH_FQ is not set/CONFIG_NET_SCH_FQ=y/' "$DEFCONFIG"
          else
            grep -q "^CONFIG_NET_SCH_FQ=y" "$DEFCONFIG" || echo "CONFIG_NET_SCH_FQ=y" >> "$DEFCONFIG"
          fi
          grep -q "CONFIG_NET_SCH_FQ=y" "$DEFCONFIG" || { echo "ERROR: fq qdisc no activado"; exit 1; }
          grep -n "CONFIG_NET_SCH_FQ" "$DEFCONFIG"

      # ============================================================
      # 7b2. TCP BBR - PORT CONDICIONAL desde el donante
      #      BBR llegó al kernel mainline en Linux 4.9 (net/ipv4/tcp_bbr.c),
      #      este árbol es 4.4.302 y NO trae el símbolo Kconfig por defecto.
      #      Si el donante lo tiene backporteado, se copia y se activa.
      #      Si no, se omite SIN FALLAR el build (evita el error visto antes).
      # ============================================================

      - name: Port TCP BBR from donor if available (non-fatal)
        working-directory: kernel
        run: |
          if [ -f ../donor/net/ipv4/tcp_bbr.c ]; then
            echo "tcp_bbr.c encontrado en el donante -> portando"
            cp -v ../donor/net/ipv4/tcp_bbr.c net/ipv4/tcp_bbr.c

            if ! grep -q "^config TCP_CONG_BBR" net/ipv4/Kconfig; then
              printf '\nconfig TCP_CONG_BBR\n\ttristate "BBR TCP"\n\tdefault n\n\t---help---\n\t  TCP BBR congestion control, portado desde el kernel donante.\n' >> net/ipv4/Kconfig
            fi

            grep -q "tcp_bbr.o" net/ipv4/Makefile || \
              echo 'obj-$(CONFIG_TCP_CONG_BBR) += tcp_bbr.o' >> net/ipv4/Makefile

            DEFCONFIG=arch/arm64/configs/lineage_a7y18lte_defconfig
            grep -q "^CONFIG_TCP_CONG_BBR=y" "$DEFCONFIG" || echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"
            echo "BBR_STATUS=ported" >> "$GITHUB_ENV"
          else
            echo "AVISO: net/ipv4/tcp_bbr.c NO existe en el donante."
            echo "Este árbol es Linux 4.4 (BBR es de mainline 4.9+) - se omite BBR, se mantiene cubic+fq."
            echo "BBR_STATUS=unavailable" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # 7c. KSM (Kernel Samepage Merging) - dedup de páginas de memoria
      # ============================================================

      - name: Enable KSM
        working-directory: kernel
        run: |
          DEFCONFIG=arch/arm64/configs/lineage_a7y18lte_defconfig
          if grep -q "^# CONFIG_KSM is not set" "$DEFCONFIG"; then
            sed -i 's/# CONFIG_KSM is not set/CONFIG_KSM=y/' "$DEFCONFIG"
          else
            grep -q "^CONFIG_KSM=y" "$DEFCONFIG" || echo "CONFIG_KSM=y" >> "$DEFCONFIG"
          fi
          grep -q "CONFIG_KSM=y" "$DEFCONFIG" || { echo "ERROR: KSM no activado"; exit 1; }
          grep -n "CONFIG_KSM" "$DEFCONFIG"

      # ============================================================
      # 8. ZRAM: activar lz4 (zstd no soportado en este kernel 4.4)
      # ============================================================

      - name: Enable lz4 compression for zram (zstd no compatible)
        working-directory: kernel
        run: |
          DEFCONFIG=arch/arm64/configs/lineage_a7y18lte_defconfig
          # Activar lz4 (el único backend adicional soportado por zram en 4.4)
          if grep -q "^# CONFIG_ZRAM_LZ4_COMPRESS is not set" "$DEFCONFIG"; then
            sed -i 's/# CONFIG_ZRAM_LZ4_COMPRESS is not set/CONFIG_ZRAM_LZ4_COMPRESS=y/' "$DEFCONFIG"
          else
            echo "CONFIG_ZRAM_LZ4_COMPRESS=y" >> "$DEFCONFIG"
          fi
          grep -q "CONFIG_ZRAM_LZ4_COMPRESS=y" "$DEFCONFIG" || { echo "ERROR: ZRAM_LZ4_COMPRESS no activado"; exit 1; }
          # También mantener CONFIG_CRYPTO_ZSTD (aunque no funcione con zram, puede ser útil para otros usos)
          if grep -q "^# CONFIG_CRYPTO_ZSTD is not set" "$DEFCONFIG"; then
            sed -i 's/# CONFIG_CRYPTO_ZSTD is not set/CONFIG_CRYPTO_ZSTD=y/' "$DEFCONFIG"
          else
            echo "CONFIG_CRYPTO_ZSTD=y" >> "$DEFCONFIG"
          fi
          grep -q "CONFIG_CRYPTO_ZSTD=y" "$DEFCONFIG" || { echo "ERROR: ZSTD no activado"; exit 1; }

      # ============================================================
      # 9. BFQ (copiar y hacerlo el scheduler por defecto parcheando Kconfig)
      # ============================================================

      - name: Port BFQ scheduler and set as default
        working-directory: kernel
        run: |
          # Copiar archivos BFQ del donante
          cp -v ../donor/block/bfq-*.c block/ || { echo "ERROR: No se copiaron .c de BFQ"; exit 1; }
          cp -v ../donor/block/bfq*.h block/ 2>/dev/null || echo "No se encontraron .h en block/"
          cp -v ../donor/include/linux/bfq*.h include/linux/ 2>/dev/null || echo "No se encontraron .h en include/linux/"
          ls -la block/bfq-iosched.c block/bfq.h || { echo "ERROR: faltan archivos BFQ"; exit 1; }

          # Modificar Kconfig.iosched para añadir BFQ
          if ! grep -q "config IOSCHED_BFQ" block/Kconfig.iosched; then
            cat >> block/Kconfig.iosched << 'EOF'

          config IOSCHED_BFQ
            tristate "BFQ I/O scheduler"
            default y
            ---help---
              BFQ (Budget Fair Queueing) is a proportional-share I/O scheduler.
              It provides low latency and fairness.
          EOF
          fi

          # Parchear Kconfig para añadir DEFAULT_BFQ en la choice "Default I/O scheduler"
          # (porque no existe nativamente)
          FILE=block/Kconfig.iosched
          if ! grep -q "config DEFAULT_BFQ" "$FILE"; then
            sed -i '/^endchoice/i\config DEFAULT_BFQ\n\tbool "BFQ" if IOSCHED_BFQ=y\n' "$FILE"
          fi
          if ! grep -q 'default "bfq" if DEFAULT_BFQ' "$FILE"; then
            sed -i '/default "noop" if DEFAULT_NOOP/a\	default "bfq" if DEFAULT_BFQ' "$FILE"
          fi
          grep -q "config DEFAULT_BFQ" "$FILE" || { echo "ERROR: no se añadió DEFAULT_BFQ al Kconfig"; exit 1; }
          grep -q 'default "bfq" if DEFAULT_BFQ' "$FILE" || { echo "ERROR: no se mapeó DEFAULT_IOSCHED a bfq"; exit 1; }

          # Makefile: solo bfq-iosched.o (bfq-cgroup.c se incluye textualmente)
          if ! grep -q "bfq" block/Makefile; then
            echo "obj-\$(CONFIG_IOSCHED_BFQ) += bfq-iosched.o" >> block/Makefile
          fi

          # Activar en defconfig y seleccionar como default
          DEFCONFIG=arch/arm64/configs/lineage_a7y18lte_defconfig
          if grep -q "^# CONFIG_IOSCHED_BFQ is not set" "$DEFCONFIG"; then
            sed -i 's/# CONFIG_IOSCHED_BFQ is not set/CONFIG_IOSCHED_BFQ=y/' "$DEFCONFIG"
          else
            echo "CONFIG_IOSCHED_BFQ=y" >> "$DEFCONFIG"
          fi
          grep -q "CONFIG_IOSCHED_BFQ=y" "$DEFCONFIG" || { echo "ERROR: BFQ no activado"; exit 1; }

          # Eliminar default previo y establecer BFQ
          sed -i '/^CONFIG_DEFAULT_DEADLINE/d;/^CONFIG_DEFAULT_CFQ/d;/^CONFIG_DEFAULT_NOOP/d;/^CONFIG_DEFAULT_IOSCHED/d' "$DEFCONFIG"
          echo "CONFIG_DEFAULT_BFQ=y" >> "$DEFCONFIG"
          grep -n "CONFIG_DEFAULT_BFQ\|CONFIG_DEFAULT_IOSCHED" "$DEFCONFIG" || true

      # ============================================================
      # INPUT BOOSTER: NO se implementa (revertido, decisión deliberada)
      # ============================================================
      # Se intentó (ver historial), pero el driver táctil real de este
      # dispositivo es Imagis IST40XX (CONFIG_TOUCHSCREEN_IST40XX=y) -
      # NO Zinitix (CONFIG_TOUCHSCREEN_ZINITIX_* están todos "not set",
      # código muerto en el árbol). El driver Imagis nunca llama a
      # input_booster_send_event(), así que una implementación atada a
      # la API de Zinitix nunca se ejecuta - confirmado con un test en
      # equipo real (debugfs pm_qos/cluster1_freq_min se mantuvo en 0
      # sin importar cuánto se tocara la pantalla).
      #
      # Peor aún: activar CONFIG_INPUT_BOOSTER apaga una rama NATIVA de
      # Samsung ya presente en drivers/input/input.c (genérica, a nivel
      # de input_event() - funciona con cualquier dispositivo, Imagis
      # incluido), alimentada por un nodo real de Device Tree
      # (arch/arm64/boot/dts/exynos/exynos7885.dtsi, nodo "input_booster")
      # con tablas de frecuencia ya calibradas por Samsung para este chip
      # (multi-nivel, distintas para KEY/TOUCHKEY/TOUCH). Esa rama nativa
      # ya estaba activa y funcionando antes de tocar nada - se deja tal
      # cual, sin CONFIG_INPUT_BOOSTER definido en ningún lado.

      # ============================================================
      # 10. WIREGUARD
      # ============================================================

      - name: Port WireGuard from donor kernel
        working-directory: kernel
        run: |
          mkdir -p net/wireguard
          cp -rv ../donor/net/wireguard/* net/wireguard/ || { echo "ERROR: No se pudo copiar WireGuard"; exit 1; }
          ls -la net/wireguard/*.c net/wireguard/*.h 2>/dev/null || { echo "ERROR: No se copió WireGuard"; exit 1; }
          if ! grep -q "net/wireguard/Kconfig" net/Kconfig; then
            sed -i '/^endmenu/i source "net/wireguard/Kconfig"' net/Kconfig
          fi
          if ! grep -q "wireguard" net/Makefile; then
            echo "obj-\$(CONFIG_WIREGUARD) += wireguard/" >> net/Makefile
          fi
          if grep -q "^# CONFIG_WIREGUARD is not set" arch/arm64/configs/lineage_a7y18lte_defconfig; then
            sed -i 's/# CONFIG_WIREGUARD is not set/CONFIG_WIREGUARD=y/' \
              arch/arm64/configs/lineage_a7y18lte_defconfig
          else
            echo "CONFIG_WIREGUARD=y" >> arch/arm64/configs/lineage_a7y18lte_defconfig
          fi
          grep -q "CONFIG_WIREGUARD=y" arch/arm64/configs/lineage_a7y18lte_defconfig || { echo "ERROR: WireGuard no activado"; exit 1; }

      # ============================================================
      # GAMING TUNING 1/2: umbrales GPU - alinear las 3 filas de arriba
      # de gpu_dvfs_table al mismo patrón (max=95) que ya usa el resto
      # de la tabla. Confirmado con gpu_dvfs_governor.c real (b_r26p0,
      # el que de verdad compila este defconfig - ver diagnostico
      # previo con Kbuild): max_threshold=100 en el escalon actual
      # exige ~100% de uso sostenido para subir de escalon, algo que
      # casi nunca se toca en gaming real. NO se toca ninguna frecuencia
      # (gpu_max_clock sigue en 1300000, sin overclock), ni la tabla de
      # throttling termico (gpu_temp_throttling intacta).
      # ============================================================

      - name: Tune GPU DVFS thresholds for gaming (top 3 steps)
        working-directory: kernel
        run: |
          echo "--- Todos los archivos con gpu_dvfs_table_size (todas las variantes SoC) ---"
          grep -rl "gpu_dvfs_table_size" arch/arm64/boot/dts 2>/dev/null

          # El arbol trae dtsi de varias variantes de SoC conviviendo
          # (7884, 7885, etc). Filtramos explicitamente por 7885, que es
          # el SoC real de este dispositivo (a7y18lte), para no repetir el
          # mismo error de "asumir por head -1" que ya paso antes con
          # Zinitix/Imagis y TMIX/Bifrost. Si no hay EXACTAMENTE un
          # candidato con 7885 en la ruta, falla en vez de adivinar.
          CANDIDATES=$(grep -rl "gpu_dvfs_table_size" arch/arm64/boot/dts 2>/dev/null | grep "7885")
          COUNT=$(echo "$CANDIDATES" | grep -c . || true)

          if [ -z "$CANDIDATES" ] || [ "$COUNT" != "1" ]; then
            echo "ERROR: no se encontro exactamente 1 archivo con gpu_dvfs_table_size y '7885' en la ruta."
            echo "Candidatos con 7885 en la ruta ($COUNT encontrados):"
            echo "$CANDIDATES"
            exit 1
          fi

          F="$CANDIDATES"
          echo "Archivo encontrado (filtrado a exynos7885): $F"
          cp "$F" "$F.orig"

          perl -0777 -pi -e 's/1300000 98  100  1/1300000 98   95  1/' "$F"
          perl -0777 -pi -e 's/1200000 98  100  1/1200000 90   95  1/' "$F"
          perl -0777 -pi -e 's/1100000 90  100  1/1100000 90   95  1/' "$F"

          echo "--- Verificacion (Regla 8): exactamente 1 coincidencia por fila tocada, y las filas de abajo intactas ---"
          [ "$(grep -c '1300000 98   95  1' "$F")" = "1" ] || { echo "ERROR: fila 1300000 no matcheo"; diff "$F.orig" "$F"; exit 1; }
          [ "$(grep -c '1200000 90   95  1' "$F")" = "1" ] || { echo "ERROR: fila 1200000 no matcheo"; diff "$F.orig" "$F"; exit 1; }
          [ "$(grep -c '1100000 90   95  1' "$F")" = "1" ] || { echo "ERROR: fila 1100000 no matcheo"; diff "$F.orig" "$F"; exit 1; }
          # CORRECCION IMPORTANTE: el gpu_max_clock real de este dispositivo
          # es 1100000, no 1300000 (confirmado por el log: exynos7885-mali.dtsi
          # linea 25). Esto significa que las filas de la tabla para 1300000 y
          # 1200000 son ALCANZABLES SOLO SI se sube gpu_max_clock por separado -
          # hoy son entradas inertes, el gobernador nunca las selecciona porque
          # estan por encima del techo real. No se toca gpu_max_clock aca (cero
          # overclock, tal como se decidio), solo se corrige el valor esperado
          # en la verificacion para que coincida con la realidad del DT.
          grep -q "gpu_max_clock = <1100000>;" "$F" || {
            echo "ERROR: gpu_max_clock no coincide con el formato esperado."
            echo "Linea real en el archivo (para ajustar el patron):"
            grep -n "gpu_max_clock" "$F"
            diff "$F.orig" "$F"
            exit 1
          }
          grep -q "gpu_temp_throttling = <845000 676000 450000 343000 343000 343000>;" "$F" || {
            echo "ERROR: gpu_temp_throttling no coincide con el formato esperado."
            echo "Linea real en el archivo (para ajustar el patron):"
            grep -n "gpu_temp_throttling" "$F"
            diff "$F.orig" "$F"
            exit 1
          }
          echo "--- Diff completo aplicado ---"
          diff "$F.orig" "$F" || true
          rm "$F.orig"

      # ============================================================
      # GAMING TUNING 2/2: techo de boost tactil (input_booster nativo
      # de Samsung, ya activo - ver decision de NO reimplementar esto
      # con CONFIG_INPUT_BOOSTER, mas arriba en este mismo workflow).
      # Se sube el techo de TOUCH y MULTITOUCH de 1144000 a 2184000 -
      # este ultimo es el maximo REAL y confirmado de la BIG (el mismo
      # valor que se uso para descartar el overclock en su momento, no
      # es un numero nuevo/inventado). Se deja todo lo demas igual:
      # duraciones (head/tail/phase_times), niveles de KEY/TOUCHKEY/
      # KEYBOARD, y los pisos de kfc/mif/int.
      # ============================================================

      - name: Tune native touch input-booster ceiling for gaming
        working-directory: kernel
        run: |
          F=$(grep -rl 'input_booster,label = "TOUCH"' arch/arm64/boot/dts 2>/dev/null | head -1)
          if [ -z "$F" ]; then
            echo "ERROR: no se encontro el archivo con el nodo input_booster TOUCH"
            exit 1
          fi
          echo "Archivo encontrado: $F"
          cp "$F" "$F.orig"

          perl -0777 -pi -e 's/(input_booster,label = "TOUCH";.*?input_booster,cpu_freqs = <)1144000 1144000 936000(>;)/${1}2184000 2184000 2184000${2}/s' "$F"
          perl -0777 -pi -e 's/(input_booster,label = "MULTITOUCH";.*?input_booster,cpu_freqs = <)1144000 936000(>;)/${1}2184000 2184000${2}/s' "$F"

          echo "--- Verificacion (Regla 8) ---"
          grep -A12 'label = "TOUCH"' "$F" | grep -q "cpu_freqs = <2184000 2184000 2184000>;" || { echo "ERROR: TOUCH no se actualizo"; diff "$F.orig" "$F"; exit 1; }
          grep -A12 'label = "MULTITOUCH"' "$F" | grep -q "cpu_freqs = <2184000 2184000>;" || { echo "ERROR: MULTITOUCH no se actualizo"; diff "$F.orig" "$F"; exit 1; }
          grep -A12 'label = "KEY"' "$F" | grep -q "cpu_freqs = <1144000>;" || { echo "ERROR: KEY se toco sin querer"; exit 1; }
          grep -A12 'label = "TOUCHKEY"' "$F" | grep -q "cpu_freqs = <1144000>;" || { echo "ERROR: TOUCHKEY se toco sin querer"; exit 1; }
          echo "--- Diff completo aplicado ---"
          diff "$F.orig" "$F" || true
          rm "$F.orig"

      # ============================================================
      # 11. COMPILACIÓN (con verificaciones de .config)
      # ============================================================

      - name: Compile kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          make O=out lineage_a7y18lte_defconfig

          # Verificaciones
          grep -q "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" out/.config || { echo "ERROR: schedutil no activo en .config"; exit 1; }
          grep -q "CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y" out/.config || { echo "ERROR: schedutil no es el gobernador por defecto en .config"; exit 1; }
          grep -q "CONFIG_FREQVAR_SCHEDTUNE=y" out/.config || { echo "ERROR: FREQVAR_SCHEDTUNE no activo en .config"; exit 1; }
          grep -q "CONFIG_CRYPTO_ZSTD=y" out/.config || { echo "ERROR: ZSTD no activo en .config"; exit 1; }
          grep -q "CONFIG_ZRAM_LZ4_COMPRESS=y" out/.config || { echo "ERROR: ZRAM_LZ4_COMPRESS no activo en .config"; exit 1; }
          grep -q "CONFIG_IOSCHED_BFQ=y" out/.config || { echo "ERROR: BFQ no activo en .config"; exit 1; }
          grep -q "CONFIG_WIREGUARD=y" out/.config || { echo "ERROR: WireGuard no activo en .config"; exit 1; }
          if ! grep -q 'CONFIG_DEFAULT_TCP_CONG="cubic"' out/.config && ! grep -q "CONFIG_DEFAULT_TCP_CONG='cubic'" out/.config && ! grep -q "CONFIG_DEFAULT_TCP_CONG=cubic" out/.config; then
            echo "ERROR: TCP cubic no configurado en .config"
            exit 1
          fi
          grep -q "CONFIG_NET_SCH_FQ=y" out/.config || { echo "ERROR: fq qdisc no activo en .config"; exit 1; }
          grep -q "CONFIG_KSM=y" out/.config || { echo "ERROR: KSM no activo en .config"; exit 1; }
          grep -q "CONFIG_THERMAL_WRITABLE_TRIPS=y" out/.config || { echo "ERROR: THERMAL_WRITABLE_TRIPS no activo en .config"; exit 1; }
          grep -q "CONFIG_TRANSPARENT_HUGEPAGE=y" out/.config || { echo "ERROR: THP no activo en .config"; exit 1; }
          grep -q "CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y" out/.config || { echo "ERROR: THP no quedó en modo madvise en .config"; exit 1; }
          grep -q "CONFIG_INPUT_BOOSTER=y" out/.config && { echo "ERROR: CONFIG_INPUT_BOOSTER quedó activo - esto apaga la rama nativa de Samsung, se decidió revertir esta feature"; exit 1; }
          # BBR es opcional (depende de si el donante lo trae backporteado a 4.4) - no bloquea el build
          if grep -q "CONFIG_TCP_CONG_BBR=y" out/.config; then
            echo "BBR activo en .config (portado del donante)"
          else
            echo "AVISO: BBR no disponible en .config (BBR_STATUS=${BBR_STATUS:-unavailable}) - build continúa con cubic+fq"
          fi

          echo "Todas las opciones están correctamente habilitadas en .config"
          make O=out -j"$(nproc)"

      - name: Verify kernel output
        working-directory: kernel
        run: |
          ls -lh out/arch/arm64/boot/Image*
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: Image not generated"
            exit 1
          fi
          echo "Kernel compiled successfully"

      # ============================================================
      # 12. EMPAQUETADO CON ANYKERNEL3
      # ============================================================

      # ============================================================
      # WATCHDOG DE SALUD DEL TOUCH IC (Imagis IST40XX)
      # ============================================================
      # Diagnóstico real: el único mecanismo de recovery que trae el
      # driver original (ist40xx_request_reset) solo cuenta errores
      # DENTRO del handler de interrupciones - si el IC deja de generar
      # interrupciones por completo (silencio total, no errores), ese
      # contador nunca sube y nunca se dispara un reset. Coincide con
      # el síntoma reportado (táctil se traba, apagar/prender pantalla
      # lo arregla al toque - eso fuerza un reset de hardware vía el
      # path de resume). Esto agrega un chequeo activo cada ~5s (lectura
      # liviana de un registro de estado ya usado en otras partes del
      # driver) que fuerza un reset si el IC deja de responder por I2C,
      # sin esperar a que el usuario apague la pantalla. Es código
      # nuevo, no un port - probado solo por compilación aislada, no en
      # equipo real todavía.

      - name: Add touch IC health-check watchdog (Imagis IST40XX)
        working-directory: kernel
        run: |
          F=drivers/input/touchscreen/imagis_40xx/ist40xx.c
          H=drivers/input/touchscreen/imagis_40xx/ist40xx.h

          perl -0777 -pi -e 's/(\tstruct delayed_work work_reset_check;\n)/$1\tstruct delayed_work work_health_check;\t\/* watchdog: IC silencioso *\/\n/' "$H"

          perl -0777 -pi -e 's/(\}\n\n#ifdef IST40XX_NOISE_MODE\nstatic void noise_work_func)/}\n\nstatic void health_check_work_func(struct work_struct *work)\n{\n\tstruct delayed_work *delayed_work = to_delayed_work(work);\n\tstruct ist40xx_data *data =\n\t    container_of(delayed_work, struct ist40xx_data,\n\t\t\t work_health_check);\n\tu32 hc_val;\n\tint hc_ret;\n\n\tif (unlikely((data == NULL) || (data->client == NULL)))\n\t\treturn;\n\n\tif (unlikely(!data->initialized ||\n\t\t     data->status.sys_mode == STATE_POWER_OFF ||\n\t\t     data->status.update == 1 ||\n\t\t     data->status.calib >= 1 || data->status.miscalib >= 1))\n\t\treturn;\n\n\t\/* Lectura liviana de un registro de estado, solo para confirmar que\n\t * el IC sigue respondiendo por I2C. El reset por conteo de errores\n\t * (ist40xx_request_reset) solo cuenta fallos DENTRO del handler de\n\t * interrupciones - si el IC deja de generar interrupciones por\n\t * completo en vez de generarlas con errores, ese contador nunca\n\t * sube. Esto cierra ese hueco con un chequeo activo periodico. *\/\n\tmutex_lock(&data->lock);\n\thc_ret = ist40xx_read_reg(data->client, IST40XX_HIB_TOUCH_STATUS, &hc_val);\n\tmutex_unlock(&data->lock);\n\n\tif (unlikely(hc_ret)) {\n\t\tinput_info(true, &data->client->dev,\n\t\t\t   "%s: IC no responde al health-check, forzando reset\\n",\n\t\t\t   __func__);\n\t\tist40xx_scheduled_reset(data);\n\t}\n}\n\n#ifdef IST40XX_NOISE_MODE\nstatic void noise_work_func/' "$F"

          perl -0pi -e 's/(\tINIT_DELAYED_WORK\(&data->work_reset_check, reset_work_func\);\n)/$1\tINIT_DELAYED_WORK(&data->work_health_check, health_check_work_func);\n/' "$F"

          perl -0pi -e 's/(\tcancel_delayed_work_sync\(&data->work_reset_check\);\n)/$1\tcancel_delayed_work_sync(&data->work_health_check);\n/g' "$F"

          perl -0777 -pi -e 's/(if \(data->irq_working \|\| !data->initialized \|\| data->rec_mode\)\n\t\tgoto restart_timer;\n\n)(\tif \(status->event_mode\) \{\n\t\tif \(likely)/$1\tif (likely(status->event_mode) \&\& status->sys_mode != STATE_POWER_OFF) {\n\t\tstatic int hc_tick;\n\t\tif (++hc_tick >= 10) {\t\/* cada ~5s (timer corre cada 500ms) *\/\n\t\t\thc_tick = 0;\n\t\t\tschedule_delayed_work(&data->work_health_check, 0);\n\t\t}\n\t}\n\n$2/' "$F"

          echo "--- Verificación: cada inserción debe dar exactamente el conteo esperado ---"
          [ "$(grep -c 'work_health_check' "$H")" = "1" ] || { echo "ERROR: campo del struct no se insertó (o se duplicó)"; exit 1; }
          [ "$(grep -c 'work_health_check' "$F")" = "5" ] || { echo "ERROR: conteo inesperado en ist40xx.c"; exit 1; }
          [ "$(grep -c 'health_check_work_func' "$F")" = "2" ] || { echo "ERROR: función no se insertó (o se duplicó)"; exit 1; }
          echo "OK: las 5 inserciones aplicaron exactamente una vez cada una"

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: sacksso/AnyKernel3-a7y18lte
          path: anykernel3
          fetch-depth: 1

      - name: Copy Image to AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image anykernel3/Image
          ls -lh anykernel3/Image

      # ============================================================
      # FIX CRITICO: anykernel.sh (revisado) no define ninguna variable
      # dtb= ni maneja el DTB de forma explicita - solo llama a
      # dump_boot/write_boot (libreria estandar de AnyKernel3). Sin un
      # archivo llamado "dtb" en la raiz del ZIP, esa libreria CONSERVA
      # el DTB que ya esta en el boot.img actual del telefono, sin
      # tocarlo - lo que significa que los cambios de GAMING TUNING
      # (gpu_dvfs_table, input_booster) compilarian bien pero NUNCA
      # llegarian al equipo. Este step busca el .dtb real generado por
      # el build (por nombre de dispositivo, para no adivinar entre
      # varios .dtb si el arbol genera mas de uno) y lo copia a la raiz
      # del ZIP con el nombre que ak3-core.sh espera.
      # ============================================================

      - name: Copy compiled DTB to AnyKernel3 (dtb changes won't apply without this)
        run: |
          echo "--- .dtb generados por este build ---"
          find kernel/out/arch/arm64/boot/dts -name "*.dtb" 2>/dev/null
          CANDIDATES=$(find kernel/out/arch/arm64/boot/dts -iname "*a7y18lte*.dtb" -o -iname "*a750*.dtb" 2>/dev/null)
          COUNT=$(echo "$CANDIDATES" | grep -c . || true)
          if [ "$COUNT" -eq 1 ]; then
            DTB="$CANDIDATES"
          else
            echo "AVISO: no se identifico un .dtb inequivoco por nombre de dispositivo (encontrados: $COUNT)."
            echo "Candidatos por nombre de SoC (exynos7885), puede haber mas de uno para distintas placas:"
            find kernel/out/arch/arm64/boot/dts -iname "*7885*.dtb" 2>/dev/null
            echo "ERROR: confirmar manualmente cual .dtb corresponde a a7y18lte antes de continuar - no se adivina"
            exit 1
          fi
          echo "DTB seleccionado: $DTB"
          cp "$DTB" anykernel3/dtb
          ls -lh anykernel3/dtb

      - name: Create build-info.txt
        run: |
          cat > anykernel3/build-info.txt <<EOF
          ============================================================
          a7y18lte Kernel Build - TESTING (con mejoras extra)
          ============================================================
          Device: Samsung Galaxy A7 2018 (a7y18lte)
          Model: SM-A750F/FN/G
          Kernel: Linux 4.4.302
          Compiler: GCC 6.4.1 (aarch64-linux-gnu) + gcc-arm-linux-gnueabi (32-bit)
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Commit: $(git --git-dir=kernel/.git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          ============================================================
          Fixes base:
            - decon_clocks_table: double -> unsigned long
            - topology.c: corrección de sintaxis en HMP mask
            - nl80211_vendor.c: inicialización de country_code
            - sched/tune.h: declaraciones forward de estructuras
          Mejoras incluidas:
            - TCP congestion control: cubic (en lugar de bic)
            - schedutil como gobernador de CPU (por defecto)
            - lz4 como algoritmo de compresión para zram (zstd no soportado en kernel 4.4)
            - BFQ I/O scheduler (por defecto, con parche en Kconfig)
            - WireGuard (VPN moderno, compilado in-tree)
            - fq qdisc (activo, compilado nativamente en este árbol)
            - TCP BBR: ${BBR_STATUS:-unavailable} (ver log del step "Port TCP BBR from donor"; si es "unavailable" el kernel usa cubic+fq igual)
            - KSM (Kernel Samepage Merging, se activa por script)
          GAMING TUNING (device tree, requiere el fix de DTB - ver mas abajo):
            - GPU: las 3 filas superiores de gpu_dvfs_table (1300/1200/1100 MHz)
              alineadas al mismo umbral max_threshold=95 que ya usa el resto de
              la tabla (antes 100, practicamente inalcanzable en gaming real).
              gpu_max_clock, gpu_max_clock_limit y gpu_temp_throttling SIN TOCAR.
            - Tactil: techo de boost del input_booster nativo (TOUCH/MULTITOUCH)
              subido de 1144000/936000 al maximo real confirmado de la BIG
              (2184000, mismo valor usado para descartar el overclock). Resto
              de nodos (KEY/TOUCHKEY/KEYBOARD) y todas las duraciones intactos.
          FIX DE EMPAQUETADO: anykernel.sh no maneja dtb de forma explicita -
          sin copiar un archivo "dtb" a la raiz del ZIP, AnyKernel3 conserva el
          DTB viejo del boot.img actual y el GAMING TUNING de arriba (que vive
          en el device tree) nunca llegaria a aplicarse. Se agrego el step
          "Copy compiled DTB to AnyKernel3" para corregir esto.
          NOTA: build de TESTING. read_ahead_kb, dirty_ratio/dirty_background_ratio,
          fq/BBR y KSM se activan en runtime desde 99-kernel-tweaks.sh (fuera de este workflow).
          SELinux: Enforcing (sin cambios)
          ============================================================
          EOF
          cat anykernel3/build-info.txt

      - name: Create flashable ZIP
        run: |
          cd anykernel3
          zip -r9 ../a7y18lte-Kernel-testing.zip . -x "*.git*"
          cd ..
          ls -lh a7y18lte-Kernel-testing.zip

      - name: Upload final ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: a7y18lte-Kernel-testing
          path: a7y18lte-Kernel-testing.zip
          if-no-files-found: error
