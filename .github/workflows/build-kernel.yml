name: Build Kernel for a7y18lte (LineageOS 18.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout del kernel (oficial LineageOS)
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      - name: Checkout toolchain GCC (aarch64)
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      - name: Instalar dependencias de build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses-dev git-core zip \
            gcc-arm-linux-gnueabi

      # ============================================================
      # PARCHE: Corregir errores conocidos en el código fuente
      # ============================================================
      - name: Aplicar parches al código fuente
        working-directory: kernel
        run: |
          echo "Aplicando parches a drivers/video/fbdev/exynos/dpu_7885/decon_reg.c"
          # Cambiar 'double' por 'unsigned long' en la tabla de clocks
          sed -i 's/const double decon_clocks_table/const unsigned long decon_clocks_table/g' drivers/video/fbdev/exynos/dpu_7885/decon_reg.c || true
          
          # (Si hay otro parche, agregarlo aquí)

      # ============================================================
      # COMPILACIÓN
      # ============================================================
      - name: Compilar kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"

          make O=out lineage_a7y18lte_defconfig
          make O=out -j"$(nproc)"

      # ============================================================
      # LISTAR SALIDA (debug)
      # ============================================================
      - name: Listar salida (debug)
        if: always()
        working-directory: kernel
        run: find out/arch/arm64/boot -maxdepth 2 2>/dev/null || echo "No se encontró la carpeta boot"

      # ============================================================
      # PREPARAR ARTIFACT: incluir kernel + magiskboot
      # ============================================================
      - name: Descargar magiskboot (para empaquetado posterior)
        run: |
          # Descargar el APK de Magisk estable más reciente
          wget -O magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v30.0/Magisk-v30.0.apk
          # Extraer libmagiskboot.so de la arquitectura arm64-v8a
          unzip -j magisk.apk lib/arm64-v8a/libmagiskboot.so -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          echo "magiskboot extraído correctamente"

      - name: Crear carpeta para artifact
        run: |
          mkdir -p artifact
          cp kernel/out/arch/arm64/boot/Image artifact/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz artifact/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz-dtb artifact/ 2>/dev/null || true
          cp magiskboot artifact/ 2>/dev/null || true
          # También copiamos el script de preparación (opcional)
          echo "Archivos copiados a artifact/"

      - name: Subir artifact completo
        uses: actions/upload-artifact@v4
        with:
          name: a7y18lte-kernel-bundle
          path: artifact/
          if-no-files-found: warn
