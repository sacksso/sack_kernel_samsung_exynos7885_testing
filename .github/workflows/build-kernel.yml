name: Build Kernel for a7y18lte (LineageOS 18.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout del kernel
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      - name: Checkout toolchain GCC (aarch64)
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses-dev git-core zip \
            gcc-arm-linux-gnueabi

      - name: Desactivar warnings como errores
        working-directory: kernel
        run: |
          echo "KBUILD_CFLAGS += -Wno-error=misleading-indentation -Wno-error=uninitialized -Wno-error=unused-variable" >> Makefile

      - name: Eliminar -mgeneral-regs-only (si existe)
        working-directory: kernel
        run: |
          sed -i 's/-mgeneral-regs-only//g' Makefile

      # ============================================================
      # CORRECCIÓN: Cambiar double -> unsigned long en decon_reg.c
      # ============================================================
      - name: Corregir tipo de decon_clocks_table (double -> unsigned long)
        working-directory: kernel
        run: |
          sed -i 's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' drivers/video/fbdev/exynos/dpu_7885/decon_reg.c
          echo "✅ Parche aplicado: decon_clocks_table ahora es unsigned long"

      # ============================================================
      # ACTIVAR SELINUX EN DEFCONFIG
      # ============================================================
      - name: Activar SELinux en defconfig
        working-directory: kernel
        run: |
          echo "CONFIG_SECURITY_SELINUX=y" >> arch/arm64/configs/lineage_a7y18lte_defconfig
          echo "CONFIG_SECURITY_SELINUX_BOOTPARAM=y" >> arch/arm64/configs/lineage_a7y18lte_defconfig
          echo "CONFIG_SECURITY_SELINUX_DISABLE=y" >> arch/arm64/configs/lineage_a7y18lte_defconfig
          echo "CONFIG_DEFAULT_SECURITY_SELINUX=y" >> arch/arm64/configs/lineage_a7y18lte_defconfig

      # ============================================================
      # COMPILACIÓN DEL KERNEL + GENERACIÓN DE Image.gz-dtb
      # ============================================================
      - name: Compilar kernel y generar Image.gz-dtb
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"

          make O=out lineage_a7y18lte_defconfig
          make O=out -j"$(nproc)"

          # ============================================================
          # INTENTAR GENERAR Image.gz-dtb
          # ============================================================

          echo "=== Intentando generar Image.gz-dtb ==="

          # Método 1: Target estándar de AOSP (más común)
          make O=out Image.gz-dtb -j"$(nproc)" 2>/dev/null || echo "Método 1 falló"

          # Método 2: Si el target falló, usar mkdtimg
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Método 1 falló, intentando con mkdtimg..."
            
            # Compilar los DTBs individuales
            make O=out dtbs -j"$(nproc)"
            
            # Crear dtb.img con mkdtimg (si existe)
            if command -v mkdtimg &> /dev/null; then
              mkdtimg -o out/arch/arm64/boot/dtb.img out/arch/arm64/boot/dts/exynos/ 2>/dev/null || true
            else
              # Si no existe mkdtimg, concatenar manualmente los dtbs
              echo "mkdtimg no encontrado, concatenando DTBs..."
              find out/arch/arm64/boot/dts -name "*.dtb" -exec cat {} + > out/arch/arm64/boot/dtb.img
            fi

            # Combinar Image.gz con dtb.img para crear Image.gz-dtb
            if [ -f out/arch/arm64/boot/Image.gz ] && [ -f out/arch/arm64/boot/dtb.img ]; then
              cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dtb.img > out/arch/arm64/boot/Image.gz-dtb
              echo "✅ Image.gz-dtb creado mediante concatenación"
            fi
          fi

          # Método 3: Verificar si el Image ya contiene el DTB incrustado
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Método 2 falló, verificando si Image ya tiene el DTB..."
            if [ -f out/arch/arm64/boot/Image ]; then
              if grep -q "d00dfeed" out/arch/arm64/boot/Image 2>/dev/null; then
                cp out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz-dtb
                echo "✅ Image ya contenía el DTB, copiado como Image.gz-dtb"
              fi
            fi
          fi

          # Mostrar archivos generados
          echo "=== Archivos en out/arch/arm64/boot ==="
          ls -la out/arch/arm64/boot/ | grep -E "Image|dtb"

      # ============================================================
      # VERIFICACIÓN: ¿Existe Image.gz-dtb?
      # ============================================================
      - name: Verificar Image.gz-dtb
        working-directory: kernel
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "⚠️  ERROR: No se generó Image.gz-dtb. Intentando con Image.gz..."
            if [ -f out/arch/arm64/boot/Image.gz ]; then
              echo "Se usará Image.gz como alternativa (puede que no bootee correctamente)"
              ls -la out/arch/arm64/boot/Image*
              exit 0
            else
              echo "❌ No se encontró ningún archivo de kernel"
              exit 1
            fi
          else
            echo "✅ Image.gz-dtb encontrado correctamente"
            ls -la out/arch/arm64/boot/Image*
          fi

      # ============================================================
      # DESCARGAR magiskboot (para empaquetado posterior)
      # ============================================================
      - name: Descargar magiskboot
        run: |
          wget -O magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v30.0/Magisk-v30.0.apk
          unzip -j magisk.apk lib/arm64-v8a/libmagiskboot.so -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          echo "magiskboot extraído correctamente"

      # ============================================================
      # PREPARAR ARTIFACT
      # ============================================================
      - name: Preparar artifact
        run: |
          mkdir -p artifact
          cp kernel/out/arch/arm64/boot/Image artifact/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz artifact/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz-dtb artifact/ 2>/dev/null || true
          cp magiskboot artifact/ 2>/dev/null || true
          echo "Contenido de artifact/:"
          ls -la artifact/

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: a7y18lte-kernel-bundle
          path: artifact/
          if-no-files-found: error
