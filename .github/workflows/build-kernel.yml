name: Build Kernel for a7y18lte (LineageOS 18.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout del kernel (oficial LineageOS)
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      - name: Checkout toolchain GCC (aarch64)
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      - name: Instalar dependencias de build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses-dev git-core zip \
            gcc-arm-linux-gnueabi

      # ============================================================
      # PARCHE OPCIONAL: Corregir error de 'double' en decon_reg.c
      # (COMENTADO por ahora para probar si el kernel arranca sin él)
      # ============================================================
      # - name: Aplicar parche a decon_reg.c (opcional)
      #   working-directory: kernel
      #   run: |
      #     sed -i 's/const double decon_clocks_table/const unsigned long decon_clocks_table/g' drivers/video/fbdev/exynos/dpu_7885/decon_reg.c || true

      # ============================================================
      # PARCHE: Desactivar advertencia de indentación engañosa
      # ============================================================
      - name: Desactivar -Werror para misleading-indentation
        working-directory: kernel
        run: |
          # Modificar el Makefile principal para agregar la bandera
          echo "KBUILD_CFLAGS += -Wno-error=misleading-indentation" >> Makefile
          echo "Se agregó -Wno-error=misleading-indentation al Makefile"

      # ============================================================
      # COMPILACIÓN
      # ============================================================
      - name: Compilar kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"

          make O=out lineage_a7y18lte_defconfig
          make O=out -j"$(nproc)"

      # ============================================================
      # VERIFICACIÓN OBLIGATORIA: ¿Existe Image.gz-dtb?
      # ============================================================
      - name: Verificar que Image.gz-dtb se haya generado
        working-directory: kernel
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "ERROR: No se generó Image.gz-dtb. La compilación falló o el DTB no está embebido."
            echo "Listado de out/arch/arm64/boot:"
            ls -la out/arch/arm64/boot/ || true
            exit 1
          else
            echo "✅ Image.gz-dtb encontrado."
            ls -la out/arch/arm64/boot/Image*
          fi

      # ============================================================
      # DESCARGAR magiskboot (para empaquetado posterior)
      # ============================================================
      - name: Descargar magiskboot
        run: |
          wget -O magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v30.0/Magisk-v30.0.apk
          unzip -j magisk.apk lib/arm64-v8a/libmagiskboot.so -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          echo "magiskboot extraído correctamente"

      # ============================================================
      # PREPARAR ARTIFACT
      # ============================================================
      - name: Preparar artifact
        run: |
          mkdir -p artifact
          cp kernel/out/arch/arm64/boot/Image artifact/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz artifact/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz-dtb artifact/ 2>/dev/null || true
          cp magiskboot artifact/ 2>/dev/null || true
          echo "Contenido de artifact/:"
          ls -la artifact/

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: a7y18lte-kernel-bundle
          path: artifact/
          if-no-files-found: error   # ← Ahora falla si no hay archivos
