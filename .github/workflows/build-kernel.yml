name: Build Kernel for a7y18lte (LineageOS 18.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout del kernel
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      # ============================================================
      # Toolchain GCC 4.9 (el que usa la comunidad para este kernel)
      # ============================================================
      - name: Checkout toolchain GCC 4.9
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-4.9
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses-dev git-core zip \
            gcc-arm-linux-gnueabi

      # ============================================================
      # Parche de decon_clocks_table (solo por si acaso)
      # ============================================================
      - name: Corregir decon_clocks_table (opcional)
        working-directory: kernel
        run: |
          sed -i 's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' drivers/video/fbdev/exynos/dpu_7885/decon_reg.c || true
          echo "✅ Parche aplicado (si era necesario)"

      # ============================================================
      # COMPILACIÓN
      # ============================================================
      - name: Compilar kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"

          make O=out lineage_a7y18lte_defconfig
          make O=out -j"$(nproc)"

      # ============================================================
      # VERIFICACIÓN: ¿Existe el Image plano?
      # ============================================================
      - name: Verificar salida
        working-directory: kernel
        run: |
          echo "=== Archivos en out/arch/arm64/boot ==="
          ls -la out/arch/arm64/boot/Image* 2>/dev/null || true
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ ERROR: No se generó el archivo Image"
            exit 1
          else
            echo "✅ Image generado correctamente"
            file out/arch/arm64/boot/Image
          fi

      # ============================================================
      # DESCARGAR magiskboot (para empaquetado posterior)
      # ============================================================
      - name: Descargar magiskboot
        run: |
          wget -O magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v30.0/Magisk-v30.0.apk
          unzip -j magisk.apk lib/arm64-v8a/libmagiskboot.so -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          echo "✅ magiskboot extraído"

      # ============================================================
      # PREPARAR ARTIFACT (incluye Image plano y magiskboot)
      # ============================================================
      - name: Preparar artifact
        run: |
          mkdir -p artifact
          cp kernel/out/arch/arm64/boot/Image artifact/
          cp kernel/out/arch/arm64/boot/Image.gz artifact/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz-dtb artifact/ 2>/dev/null || true
          cp magiskboot artifact/
          echo "Contenido de artifact/:"
          ls -la artifact/

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: a7y18lte-kernel-bundle
          path: artifact/
          if-no-files-found: error
