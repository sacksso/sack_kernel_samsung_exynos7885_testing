name: Build Kernel for a7y18lte (LineageOS 18.1) - Overclock GPU+CPU + AnyKernel3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      - name: Checkout GCC 6.4.1 toolchain
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            git-core \
            zip \
            gcc-arm-linux-gnueabi

      # ============================================================
      # FIXES DE COMPILACIÓN
      # ============================================================

      - name: Fix decon_clocks_table
        working-directory: kernel
        run: |
          sed -i \
          's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' \
          drivers/video/fbdev/exynos/dpu_7885/decon_reg.c

      - name: Fix topology.c warning
        working-directory: kernel
        run: |
          sed -i \
          's/if (strlen(CONFIG_HMP_FAST_CPU_MASK)) (strlen(CONFIG_HMP_SLOW_CPU_MASK)); {/if (strlen(CONFIG_HMP_FAST_CPU_MASK) \&\& strlen(CONFIG_HMP_SLOW_CPU_MASK)) {/' \
          arch/arm64/kernel/topology.c

      - name: Fix nl80211 country_code
        working-directory: kernel
        run: |
          sed -i \
          's/char country_code\[SLSI_COUNTRY_CODE_LEN\];/char country_code[SLSI_COUNTRY_CODE_LEN] = {0};/' \
          drivers/net/wireless/scsc/nl80211_vendor.c

      # ============================================================
      # OVERCLOCK CPU
      # ============================================================

      - name: Apply CPU overclock in exynos-acme.c
        working-directory: kernel
        run: |
          perl -0777 -pi -e '
          s/(domain->resume_freq = cal_dfs_get_resume_freq\(domain->cal_id\);)/$1\n
          \tif (domain->id == 0) {\n
          \t\tdomain->max_freq = 1690000;\n
          \t\tdomain->min_freq = 208000;\n
          \t} else if (domain->id == 1) {\n
          \t\tdomain->max_freq = 2288000;\n
          \t\tdomain->min_freq = 208000;\n
          \t}/s
          ' drivers/cpufreq/exynos-acme.c

      - name: Apply MIF constraints for overclock frequencies
        working-directory: kernel
        run: |
          perl -0777 -pi -e '
          s/(if \(freq >= table\[c_index\]\.master_freq\)\s*break;)/$1\n
          \t\tif (freq == 2288000)\n
          \t\t\tdm->c.freq_table[index].constraint_freq = 1794000;\n
          \t\tif (freq == 1690000)\n
          \t\t\tdm->c.freq_table[index].constraint_freq = 1014000;/s
          ' drivers/cpufreq/exynos-acme.c

      # ============================================================
      # OVERCLOCK GPU (MODIFICACIÓN EN DEVICE TREE)
      # ============================================================

      - name: Apply GPU overclock in exynos7885-mali.dtsi
        working-directory: kernel
        run: |
          sed -i \
            's/gpu_max_clock = <1100000>;/gpu_max_clock = <1300000>;/' \
            arch/arm64/boot/dts/exynos/exynos7885-mali.dtsi
          sed -i \
            's/gpu_max_clock_limit = <1100000>;/gpu_max_clock_limit = <1300000>;/' \
            arch/arm64/boot/dts/exynos/exynos7885-mali.dtsi
          echo "GPU max clock cambiado a 1300000"
          grep -n "gpu_max_clock" \
            arch/arm64/boot/dts/exynos/exynos7885-mali.dtsi

      # ============================================================
      # OVERCLOCK GPU (MODIFICACIÓN DIRECTA DEL DRIVER MALI)
      # ============================================================

      - name: Force GPU max clock in mali driver
        working-directory: kernel
        run: |
          # Buscar archivos del driver Mali y forzar gpu_max_clock
          find drivers/gpu/arm -name "*.c" -exec grep -l "gpu_max_clock" {} \; | while read file; do
            echo "Modificando $file"
            sed -i 's/gpu_max_clock[[:space:]]*=[[:space:]]*[0-9]\+;/gpu_max_clock = 1300000;/g' "$file"
            sed -i 's/gpu_max_clock_limit[[:space:]]*=[[:space:]]*[0-9]\+;/gpu_max_clock_limit = 1300000;/g' "$file"
          done
          # Asegurar que la tabla DVFS incluya 1300000
          find drivers/gpu/arm -name "*.c" -exec grep -l "gpu_dvfs_table" {} \; | while read file; do
            echo "Verificando tabla DVFS en $file"
            if ! grep -q "1300000" "$file"; then
              sed -i '/gpu_dvfs_table/s/{ *[0-9]*, *[0-9]* *, *[0-9]* *, *[0-9]* *, *[0-9]* *, *[0-9]* *, *[0-9]* *};/{1300000, 98, 100, 1, 1794000, 1586000, 0}, \0/g' "$file"
            fi
          done
          echo "Driver Mali modificado para forzar 1300000 MHz"

      # ============================================================
      # COMPILACIÓN
      # ============================================================

      - name: Compile kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          make O=out lineage_a7y18lte_defconfig
          make O=out -j"$(nproc)"

      # ============================================================
      # VERIFICACIÓN DE SALIDA
      # ============================================================

      - name: Verify kernel output
        working-directory: kernel
        run: |
          ls -lh out/arch/arm64/boot/Image*
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: Image not generated"
            exit 1
          fi
          echo "Kernel compiled successfully"

      # ============================================================
      # CLONAR ANYKERNEL3
      # ============================================================

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: sacksso/AnyKernel3-a7y18lte
          path: anykernel3
          fetch-depth: 1

      # ============================================================
      # COPIAR IMAGEN DEL KERNEL
      # ============================================================

      - name: Copy Image to AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image anykernel3/Image
          echo "Image copiado correctamente a AnyKernel3"
          ls -lh anykernel3/Image

      # ============================================================
      # GENERAR build-info.txt
      # ============================================================

      - name: Create build-info.txt
        run: |
          cat > anykernel3/build-info.txt <<EOF
          ========================================
          a7y18lte OC Kernel Build Information
          ========================================
          Device: Samsung Galaxy A7 2018 (a7y18lte)
          Model: SM-A750F/FN/G
          Kernel: Linux 4.4.302
          Compiler: GCC 6.4.1
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Commit: $(git --git-dir=kernel/.git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          ========================================
          CPU Overclock:
            BIG (Cortex-A73): 2288000 Hz (stock 2184000)
            LITTLE (Cortex-A53): 1690000 Hz (stock 1586000)
          ========================================
          GPU Overclock (Mali-G71 MP2):
            Max frequency: 1300000 Hz (stock 1100000)
          ========================================
          This ZIP contains:
            - Patched kernel Image
            - AnyKernel3 installer
            - Suitable for TWRP installation
          ========================================
          EOF
          cat anykernel3/build-info.txt

      # ============================================================
      # EMPAQUETADO DEL ZIP
      # ============================================================

      - name: Create flashable ZIP
        run: |
          cd anykernel3
          zip -r9 ../a7y18lte-OC-Kernel.zip . -x "*.git*"
          cd ..
          echo "ZIP creado correctamente"
          ls -lh a7y18lte-OC-Kernel.zip

      # ============================================================
      # SUBIR EL ZIP COMO ARTIFACTO
      # ============================================================

      - name: Upload final ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: a7y18lte-OC-Kernel
          path: a7y18lte-OC-Kernel.zip
          if-no-files-found: error
