name: Build Kernel for a7y18lte - Stable + Mejoras (schedutil, ZSTD, BFQ, WireGuard)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ============================================================
      # 1. CHECKOUTS
      # ============================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      - name: Checkout GCC 6.4.1 toolchain
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      - name: Checkout kernel donante (BFQ + WireGuard)
        uses: actions/checkout@v4
        with:
          repository: prashantpaddune/android_kernel_samsung_a7y18lte
          path: donor
          fetch-depth: 1

      # ============================================================
      # 2. DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            git-core \
            zip \
            gcc-arm-linux-gnueabi

      # ============================================================
      # 3. FIXES BASE
      # ============================================================

      - name: Fix decon_clocks_table
        working-directory: kernel
        run: |
          sed -i 's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' \
            drivers/video/fbdev/exynos/dpu_7885/decon_reg.c
          grep -n "^const unsigned long decon_clocks_table" drivers/video/fbdev/exynos/dpu_7885/decon_reg.c

      - name: Fix topology.c warning
        working-directory: kernel
        run: |
          sed -i 's/if (strlen(CONFIG_HMP_FAST_CPU_MASK)) (strlen(CONFIG_HMP_SLOW_CPU_MASK)); {/if (strlen(CONFIG_HMP_FAST_CPU_MASK) \&\& strlen(CONFIG_HMP_SLOW_CPU_MASK)) {/' \
            arch/arm64/kernel/topology.c
          grep -n "strlen(CONFIG_HMP_FAST_CPU_MASK)" arch/arm64/kernel/topology.c

      - name: Fix nl80211 country_code
        working-directory: kernel
        run: |
          sed -i 's/char country_code\[SLSI_COUNTRY_CODE_LEN\];/char country_code[SLSI_COUNTRY_CODE_LEN] = {0};/' \
            drivers/net/wireless/scsc/nl80211_vendor.c
          grep -n "char country_code\[SLSI_COUNTRY_CODE_LEN\]" drivers/net/wireless/scsc/nl80211_vendor.c

      - name: Fix sched/tune.h - forward declare structs
        working-directory: kernel
        run: |
          ANCHOR='static inline int schedtune_freqvar_boost_init'
          if ! grep -qF "$ANCHOR" kernel/sched/tune.h; then
            echo "ERROR: no se encontró la línea ancla '$ANCHOR' en kernel/sched/tune.h."
            exit 1
          fi
          if ! grep -q "^struct cpufreq_policy;" kernel/sched/tune.h; then
            sed -i "/$ANCHOR/i struct cpufreq_policy;" kernel/sched/tune.h
          fi
          if ! grep -q "^struct freqvar_boost_data;" kernel/sched/tune.h; then
            sed -i "/$ANCHOR/i struct freqvar_boost_data;" kernel/sched/tune.h
          fi
          grep -n "struct cpufreq_policy;" kernel/sched/tune.h
          grep -n "struct freqvar_boost_data;" kernel/sched/tune.h

      # ============================================================
      # 4. TCP CUBIC
      # ============================================================

      - name: Set default TCP congestion control to cubic
        working-directory: kernel
        run: |
          sed -i 's/^CONFIG_DEFAULT_TCP_CONG="bic"/CONFIG_DEFAULT_TCP_CONG="cubic"/' \
            arch/arm64/configs/lineage_a7y18lte_defconfig
          if ! grep -q '^CONFIG_DEFAULT_TCP_CONG="cubic"' arch/arm64/configs/lineage_a7y18lte_defconfig; then
            echo 'CONFIG_DEFAULT_TCP_CONG="cubic"' >> arch/arm64/configs/lineage_a7y18lte_defconfig
          fi
          grep -n "^CONFIG_DEFAULT_TCP_CONG" arch/arm64/configs/lineage_a7y18lte_defconfig

      # ============================================================
      # 5. SCHEDUTIL + FREQVAR_SCHEDTUNE
      # ============================================================

      - name: Enable schedutil governor and freqvar_schedtune
        working-directory: kernel
        run: |
          # Activar schedutil
          if grep -q "^# CONFIG_CPU_FREQ_GOV_SCHEDUTIL is not set" arch/arm64/configs/lineage_a7y18lte_defconfig; then
            sed -i 's/# CONFIG_CPU_FREQ_GOV_SCHEDUTIL is not set/CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y/' \
              arch/arm64/configs/lineage_a7y18lte_defconfig
          else
            echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" >> arch/arm64/configs/lineage_a7y18lte_defconfig
          fi
          # Activar FREQVAR_SCHEDTUNE (necesario para evitar error de 'freqvar_boost')
          if grep -q "^# CONFIG_FREQVAR_SCHEDTUNE is not set" arch/arm64/configs/lineage_a7y18lte_defconfig; then
            sed -i 's/# CONFIG_FREQVAR_SCHEDTUNE is not set/CONFIG_FREQVAR_SCHEDTUNE=y/' \
              arch/arm64/configs/lineage_a7y18lte_defconfig
          elif ! grep -q "^CONFIG_FREQVAR_SCHEDTUNE=y" arch/arm64/configs/lineage_a7y18lte_defconfig; then
            echo "CONFIG_FREQVAR_SCHEDTUNE=y" >> arch/arm64/configs/lineage_a7y18lte_defconfig
          fi
          grep "CONFIG_CPU_FREQ_GOV_SCHEDUTIL" arch/arm64/configs/lineage_a7y18lte_defconfig
          grep "CONFIG_FREQVAR_SCHEDTUNE" arch/arm64/configs/lineage_a7y18lte_defconfig || true

      # ============================================================
      # 6. ZSTD PARA ZRAM
      # ============================================================

      - name: Enable ZSTD compression for zram
        working-directory: kernel
        run: |
          # Activar CRYPTO_ZSTD
          if grep -q "^# CONFIG_CRYPTO_ZSTD is not set" arch/arm64/configs/lineage_a7y18lte_defconfig; then
            sed -i 's/# CONFIG_CRYPTO_ZSTD is not set/CONFIG_CRYPTO_ZSTD=y/' \
              arch/arm64/configs/lineage_a7y18lte_defconfig
          else
            echo "CONFIG_CRYPTO_ZSTD=y" >> arch/arm64/configs/lineage_a7y18lte_defconfig
          fi
          # Establecer ZSTD como compresor por defecto para zram
          if grep -q "^CONFIG_ZRAM_DEF_COMP=" arch/arm64/configs/lineage_a7y18lte_defconfig; then
            sed -i 's/^CONFIG_ZRAM_DEF_COMP=.*/CONFIG_ZRAM_DEF_COMP="zstd"/' \
              arch/arm64/configs/lineage_a7y18lte_defconfig
          else
            echo 'CONFIG_ZRAM_DEF_COMP="zstd"' >> arch/arm64/configs/lineage_a7y18lte_defconfig
          fi
          grep "CONFIG_CRYPTO_ZSTD" arch/arm64/configs/lineage_a7y18lte_defconfig
          grep "ZRAM_DEF_COMP" arch/arm64/configs/lineage_a7y18lte_defconfig

      # ============================================================
      # 7. FIX PARA arch_scale_freq_invariant (necesario para schedutil)
      # ============================================================

      - name: Fix arch_scale_freq_invariant for schedutil
        working-directory: kernel
        run: |
          # Añadir definición de arch_scale_freq_invariant si no existe
          if ! grep -q "arch_scale_freq_invariant" kernel/sched/cpufreq_schedutil.c; then
            sed -i '/^#include <linux\/sched.h>/a #ifndef arch_scale_freq_invariant\n#define arch_scale_freq_invariant() false\n#endif' kernel/sched/cpufreq_schedutil.c
          fi
          # Verificar
          grep -n "arch_scale_freq_invariant" kernel/sched/cpufreq_schedutil.c

      # ============================================================
      # 8. BFQ (con copia completa y verificaciones)
      # ============================================================

      - name: Port BFQ scheduler from donor kernel
        working-directory: kernel
        run: |
          # 1. Copiar TODOS los archivos BFQ del donante
          cp -v ../donor/block/bfq-*.c block/ 2>/dev/null || { echo "ERROR: No se encontraron .c de BFQ"; exit 1; }
          cp -v ../donor/block/bfq*.h block/ 2>/dev/null || echo "No hay .h en block/, buscando en include/linux/..."
          cp -v ../donor/include/linux/bfq*.h include/linux/ 2>/dev/null || echo "No hay .h en include/linux/"

          # 2. Verificar que los archivos principales existen
          echo "=== Archivos BFQ en block/ ==="
          ls -la block/bfq* 2>/dev/null || { echo "ERROR: No se copió ningún archivo BFQ"; exit 1; }
          if [ ! -f block/bfq.h ]; then
            echo "ADVERTENCIA: block/bfq.h no existe. Si bfq-iosched.c lo requiere, la compilación fallará más adelante."
          fi
          echo "=== Archivos BFQ en include/linux/ ==="
          ls -la include/linux/bfq* 2>/dev/null || echo "No hay cabeceras en include/linux/ (puede ser normal)"

          # 3. Modificar Kconfig.iosched
          if ! grep -q "config IOSCHED_BFQ" block/Kconfig.iosched; then
            cat >> block/Kconfig.iosched << 'EOF'

          config IOSCHED_BFQ
            tristate "BFQ I/O scheduler"
            default y
            ---help---
              BFQ (Budget Fair Queueing) is a proportional-share I/O scheduler.
              It provides low latency and fairness.
          EOF
          fi

          # 4. Modificar Makefile
          if ! grep -q "bfq" block/Makefile; then
            echo "obj-\$(CONFIG_IOSCHED_BFQ) += bfq-iosched.o bfq-cgroup.o" >> block/Makefile
          fi

          # 5. Activar en defconfig
          if grep -q "^# CONFIG_IOSCHED_BFQ is not set" arch/arm64/configs/lineage_a7y18lte_defconfig; then
            sed -i 's/# CONFIG_IOSCHED_BFQ is not set/CONFIG_IOSCHED_BFQ=y/' \
              arch/arm64/configs/lineage_a7y18lte_defconfig
          else
            echo "CONFIG_IOSCHED_BFQ=y" >> arch/arm64/configs/lineage_a7y18lte_defconfig
          fi
          grep "CONFIG_IOSCHED_BFQ" arch/arm64/configs/lineage_a7y18lte_defconfig

      # ============================================================
      # 9. WIREGUARD (con copia completa y verificaciones)
      # ============================================================

      - name: Port WireGuard from donor kernel
        working-directory: kernel
        run: |
          # 1. Copiar todo el directorio net/wireguard del donante
          mkdir -p net/wireguard
          cp -rv ../donor/net/wireguard/* net/wireguard/ || { echo "ERROR: No se pudo copiar WireGuard"; exit 1; }

          # 2. Verificar que hay archivos
          echo "=== Archivos WireGuard en net/wireguard/ ==="
          ls -la net/wireguard/*.c net/wireguard/*.h 2>/dev/null || { echo "ERROR: No se copió WireGuard"; exit 1; }

          # 3. Modificar net/Kconfig
          if ! grep -q "net/wireguard/Kconfig" net/Kconfig; then
            sed -i '/^endmenu/i source "net/wireguard/Kconfig"' net/Kconfig
          fi

          # 4. Modificar net/Makefile
          if ! grep -q "wireguard" net/Makefile; then
            echo "obj-\$(CONFIG_WIREGUARD) += wireguard/" >> net/Makefile
          fi

          # 5. Activar en defconfig
          if grep -q "^# CONFIG_WIREGUARD is not set" arch/arm64/configs/lineage_a7y18lte_defconfig; then
            sed -i 's/# CONFIG_WIREGUARD is not set/CONFIG_WIREGUARD=y/' \
              arch/arm64/configs/lineage_a7y18lte_defconfig
          else
            echo "CONFIG_WIREGUARD=y" >> arch/arm64/configs/lineage_a7y18lte_defconfig
          fi
          grep "CONFIG_WIREGUARD" arch/arm64/configs/lineage_a7y18lte_defconfig

          # 6. Copiar script de auto-actualización (si existe)
          if [ -f ../donor/scripts/fetch-latest-wireguard.sh ]; then
            cp ../donor/scripts/fetch-latest-wireguard.sh scripts/
            chmod +x scripts/fetch-latest-wireguard.sh
            echo "WireGuard auto-update script copied to scripts/"
          else
            echo "No fetch-latest-wireguard.sh found in donor; skipping."
          fi

      # ============================================================
      # 10. COMPILACIÓN (con verificaciones de .config)
      # ============================================================

      - name: Compile kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          make O=out lineage_a7y18lte_defconfig

          # Verificar que las opciones estén en .config
          grep -q "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" out/.config || { echo "ERROR: schedutil no activo"; exit 1; }
          grep -q "CONFIG_FREQVAR_SCHEDTUNE=y" out/.config || { echo "ERROR: FREQVAR_SCHEDTUNE no activo"; exit 1; }
          grep -q "CONFIG_CRYPTO_ZSTD=y" out/.config || { echo "ERROR: ZSTD no activo"; exit 1; }
          grep -q "CONFIG_IOSCHED_BFQ=y" out/.config || { echo "ERROR: BFQ no activo"; exit 1; }
          grep -q "CONFIG_WIREGUARD=y" out/.config || { echo "ERROR: WireGuard no activo"; exit 1; }
          grep -q 'CONFIG_DEFAULT_TCP_CONG="cubic"' out/.config || { echo "ERROR: TCP cubic no configurado"; exit 1; }
          echo "Todas las opciones están correctamente habilitadas."

          make O=out -j"$(nproc)"

      - name: Verify kernel output
        working-directory: kernel
        run: |
          ls -lh out/arch/arm64/boot/Image*
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: Image not generated"
            exit 1
          fi
          echo "Kernel compiled successfully"

      # ============================================================
      # 11. EMPAQUETADO CON ANYKERNEL3
      # ============================================================

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: sacksso/AnyKernel3-a7y18lte
          path: anykernel3
          fetch-depth: 1

      - name: Copy Image to AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image anykernel3/Image
          ls -lh anykernel3/Image

      - name: Create build-info.txt
        run: |
          cat > anykernel3/build-info.txt <<EOF
          ============================================================
          a7y18lte Kernel Build (con mejoras)
          ============================================================
          Device: Samsung Galaxy A7 2018 (a7y18lte)
          Model: SM-A750F/FN/G
          Kernel: Linux 4.4.302
          Compiler: GCC 6.4.1 (aarch64-linux-gnu) + gcc-arm-linux-gnueabi (32-bit)
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Commit: $(git --git-dir=kernel/.git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          ============================================================
          Fixes base:
            - decon_clocks_table: double -> unsigned long
            - topology.c: corrección de sintaxis en HMP mask
            - nl80211_vendor.c: inicialización de country_code
            - sched/tune.h: declaración de structs cpufreq_policy y freqvar_boost_data
          Mejoras incluidas:
            - TCP congestion control: cubic (en lugar de bic)
            - schedutil como gobernador de CPU
            - ZSTD para zram (compresión por defecto)
            - BFQ I/O scheduler (sustituye a cfq)
            - WireGuard (VPN moderno, con script de auto-actualización)
          SELinux: Enforcing (sin cambios)
          Sin overclock. Sin KCFLAGS de supresión.
          ============================================================
          EOF
          cat anykernel3/build-info.txt

      - name: Create flashable ZIP
        run: |
          cd anykernel3
          zip -r9 ../a7y18lte-Kernel-v4.zip . -x "*.git*"
          cd ..
          ls -lh a7y18lte-Kernel-v4.zip

      - name: Upload final ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: a7y18lte-Kernel-v4
          path: a7y18lte-Kernel-v4.zip
          if-no-files-found: error
