name: Build a7y18lte kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout del kernel
        uses: actions/checkout@v4
        with:
          repository: sacksso/sack_kernel_samsung_exynos7885_testing
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      - name: Checkout toolchain GCC 6.4.1 (aarch64)
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      - name: Instalar dependencias de build + GCC ARM32 moderno de Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses-dev git-core zip \
            gcc-arm-linux-gnueabi

      - name: Debug - confirmar prefijo real del toolchain aarch64
        run: |
          echo "--- contenido de toolchain/aarch64/bin ---"
          ls toolchain/aarch64/bin/ | grep gcc

      - name: Compilar kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"

          make O=out lineage_a7y18lte_defconfig
          make O=out -j"$(nproc)"

      - name: Listar salida (debug, corre siempre)
        if: always()
        working-directory: kernel
        run: find out/arch/arm64/boot -maxdepth 1 2>/dev/null || echo "carpeta boot no existe todavia"

      - name: Subir el Image compilado
        uses: actions/upload-artifact@v4
        with:
          name: a7y18lte-kernel-Image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: warn
