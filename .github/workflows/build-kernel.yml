name: Build Kernel for a7y18lte (LineageOS 18.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout del kernel (limpio)
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      - name: Checkout toolchain GCC
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses-dev git-core zip \
            gcc-arm-linux-gnueabi

      # ============================================================
      # CORRECCIÓN: Cambiar double -> unsigned long en decon_reg.c
      # ============================================================
      - name: Corregir tipo de decon_clocks_table (double -> unsigned long)
        working-directory: kernel
        run: |
          sed -i 's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' drivers/video/fbdev/exynos/dpu_7885/decon_reg.c
          echo "✅ Parche aplicado: decon_clocks_table ahora es unsigned long"
          grep -n "decon_clocks_table\[\]\[CLK_ID_MAX\]" drivers/video/fbdev/exynos/dpu_7885/decon_reg.c

      # ============================================================
      # COMPILACIÓN (con KCFLAGS para warnings no críticos)
      # ============================================================
      - name: Compilar kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export KCFLAGS="-Wno-error"

          make O=out lineage_a7y18lte_defconfig
          make O=out -j"$(nproc)" KCFLAGS="$KCFLAGS"

      # ============================================================
      # VERIFICACIÓN CORREGIDA: buscar Image y dtb.img
      # ============================================================
      - name: Verificar salida del kernel
        working-directory: kernel
        run: |
          echo "--- Contenido de out/arch/arm64/boot ---"
          find out/arch/arm64/boot -maxdepth 2
          if [ ! -f out/arch/arm64/boot/Image ] && [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "ERROR: No se generó ni Image ni Image.gz"
            exit 1
          fi
          if [ -f out/arch/arm64/boot/dtb.img ]; then
            echo "✅ dtb.img encontrado (formato esperado para este kernel)"
          else
            echo "⚠️ No se encontró dtb.img — puede que el DTB se genere en otra ruta, revisar el listado de arriba"
          fi

      # ============================================================
      # VERIFICACIÓN ADICIONAL: asegurar que no hay instrucciones NEON/FP
      # ============================================================
      - name: Verificar ausencia de instrucciones NEON/FP reales
        working-directory: kernel
        run: |
          OBJDUMP="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-objdump"
          OBJFILE=$(find out -name 'decon_reg.o' | head -1)
          echo "Revisando: $OBJFILE"
          if $OBJDUMP -d "$OBJFILE" | grep -Ei '\b(fmov|fadd|fsub|fmul|fdiv|fcmp|ldr[[:space:]]+q|str[[:space:]]+q|[[:space:]]v[0-9]+\.)\b'; then
            echo "❌ Se encontraron instrucciones NEON/FP reales en decon_reg.o — NO continuar"
            exit 1
          else
            echo "✅ decon_reg.o no usa NEON/FP real — confirmado que era solo el falso positivo del compilador"
          fi

      # ============================================================
      # DESCARGAR magiskboot (para empaquetado posterior)
      # ============================================================
      - name: Descargar magiskboot
        run: |
          wget -O magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v30.0/Magisk-v30.0.apk
          unzip -j magisk.apk lib/arm64-v8a/libmagiskboot.so -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          echo "magiskboot extraído correctamente"

      # ============================================================
      # PREPARAR ARTIFACT (incluyendo Image, dtb.img y magiskboot)
      # ============================================================
      - name: Preparar artifact
        run: |
          mkdir -p artifact
          cp kernel/out/arch/arm64/boot/Image artifact/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz artifact/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/dtb.img artifact/ 2>/dev/null || true
          cp magiskboot artifact/ 2>/dev/null || true
          echo "Contenido de artifact/:"
          ls -la artifact/

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: a7y18lte-kernel-bundle
          path: artifact/
          if-no-files-found: error
