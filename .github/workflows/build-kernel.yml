name: Build Kernel a7y18lte OC CPU+GPU AnyKernel3

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:


    ############################################################
    # CHECKOUT
    ############################################################

    - name: Checkout kernel
      uses: actions/checkout@v4
      with:
        repository: sacksso/sack_kernel_samsung_exynos7885_testing
        ref: main
        path: kernel
        fetch-depth: 1


    - name: Checkout GCC 6.4.1
      uses: actions/checkout@v4
      with:
        repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
        ref: lineage-18.1
        path: toolchain/aarch64
        fetch-depth: 1



    ############################################################
    # DEPENDENCIAS
    ############################################################

    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          libncurses-dev \
          git \
          zip \
          gcc-arm-linux-gnueabi



    ############################################################
    # FIXES COMPILACION
    ############################################################

    - name: Fix decon clocks
      working-directory: kernel
      run: |

        sed -i \
        's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' \
        drivers/video/fbdev/exynos/dpu_7885/decon_reg.c


    - name: Fix topology warning
      working-directory: kernel
      run: |

        sed -i \
        's/if (strlen(CONFIG_HMP_FAST_CPU_MASK)) (strlen(CONFIG_HMP_SLOW_CPU_MASK)); {/if (strlen(CONFIG_HMP_FAST_CPU_MASK) \&\& strlen(CONFIG_HMP_SLOW_CPU_MASK)) {/' \
        arch/arm64/kernel/topology.c


    - name: Fix nl80211
      working-directory: kernel
      run: |

        sed -i \
        's/char country_code\[SLSI_COUNTRY_CODE_LEN\];/char country_code[SLSI_COUNTRY_CODE_LEN] = {0};/' \
        drivers/net/wireless/scsc/nl80211_vendor.c



    ############################################################
    # CPU OVERCLOCK
    ############################################################

    - name: Apply CPU overclock
      working-directory: kernel
      run: |

        perl -0777 -pi -e '

        s/(domain->resume_freq = cal_dfs_get_resume_freq\(domain->cal_id\);)/$1\n
        \tif(domain->id == 0){\n
        \t\tdomain->max_freq = 1690000;\n
        \t\tdomain->min_freq = 208000;\n
        \t}\n
        \telse if(domain->id == 1){\n
        \t\tdomain->max_freq = 2288000;\n
        \t\tdomain->min_freq = 208000;\n
        \t}/s

        ' drivers/cpufreq/exynos-acme.c



    ############################################################
    # GPU OVERCLOCK
    ############################################################

    - name: Apply Mali GPU overclock
      working-directory: kernel
      run: |

        sed -i \
        's/gpu_max_clock = <1100000>;/gpu_max_clock = <1300000>;/' \
        arch/arm64/boot/dts/exynos/exynos7885-mali.dtsi


        sed -i \
        's/gpu_max_clock_limit = <1100000>;/gpu_max_clock_limit = <1300000>;/' \
        arch/arm64/boot/dts/exynos/exynos7885-mali.dtsi



    ############################################################
    # VERIFICACION GPU SOURCE
    ############################################################

    - name: Verify GPU OC source
      working-directory: kernel
      run: |

        echo "GPU values:"

        grep gpu_max_clock \
        arch/arm64/boot/dts/exynos/exynos7885-mali.dtsi


        if grep -q "gpu_max_clock = <1300000>;" \
        arch/arm64/boot/dts/exynos/exynos7885-mali.dtsi

        then

          echo "GPU OC enabled"

        else

          echo "ERROR GPU OC missing"
          exit 1

        fi



    ############################################################
    # COMPILACION
    ############################################################

    - name: Compile kernel
      working-directory: kernel
      run: |

        export ARCH=arm64
        export SUBARCH=arm64

        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-

        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-


        make O=out lineage_a7y18lte_defconfig

        make O=out -j$(nproc)



    ############################################################
    # VERIFICAR IMAGE
    ############################################################

    - name: Verify kernel image
      run: |

        ls -lh kernel/out/arch/arm64/boot/


        test -f \
        kernel/out/arch/arm64/boot/Image


        echo "Kernel Image OK"



    ############################################################
    # ANYKERNEL3
    ############################################################

    - name: Clone AnyKernel3
      run: |

        git clone \
        --depth=1 \
        https://github.com/sacksso/AnyKernel3-a7y18lte-overclock.git \
        anykernel



    - name: Copy kernel Image
      run: |

        cp \
        kernel/out/arch/arm64/boot/Image \
        anykernel/Image



    ############################################################
    # BUILD INFO
    ############################################################

    - name: Create build info
      run: |

        cat > anykernel/build-info.txt <<EOF

Device:
Samsung Galaxy A7 2018

Codename:
a7y18lte


Kernel:
4.4.302


CPU OC:

Cortex-A53:
1690000 Hz

Cortex-A73:
2288000 Hz


GPU OC:

Mali-G71 MP2

1300000 Hz


Build:

$(date)

EOF



    ############################################################
    # ZIP FINAL
    ############################################################

    - name: Create flashable ZIP
      run: |

        cd anykernel

        zip -r9 \
        ../AnyKernel3-a7y18lte-OC-final.zip \
        .



    ############################################################
    # UPLOAD
    ############################################################

    - name: Upload final ZIP
      uses: actions/upload-artifact@v4

      with:

        name: a7y18lte-OC-kernel-flashable

        path:

          AnyKernel3-a7y18lte-OC-final.zip
