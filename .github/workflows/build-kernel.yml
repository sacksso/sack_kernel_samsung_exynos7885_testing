name: Build Kernel for a7y18lte (LineageOS 18.1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout del kernel
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      # ============================================================
      # Toolchain GCC 5.5 (ni muy viejo ni muy nuevo)
      # ============================================================
      - name: Checkout toolchain GCC 5.5
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-5.5
          ref: lineage-19.1
          path: toolchain/aarch64
          fetch-depth: 1

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses-dev git-core zip \
            gcc-arm-linux-gnueabi

      # ============================================================
      # Desactivar warning de misleading-indentation (solo si falla)
      # ============================================================
      - name: Desactivar warnings
        working-directory: kernel
        run: |
          # GCC 5.5 sí soporta -Wmisleading-indentation, pero lo dejamos por si acaso
          echo "KBUILD_CFLAGS += -Wno-error=misleading-indentation" >> Makefile || true

      # ============================================================
      # Parche de decon_clocks_table (si es necesario)
      # ============================================================
      - name: Corregir decon_clocks_table
        working-directory: kernel
        run: |
          sed -i 's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' drivers/video/fbdev/exynos/dpu_7885/decon_reg.c || true

      # ============================================================
      # COMPILACIÓN
      # ============================================================
      - name: Compilar kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"

          make O=out lineage_a7y18lte_defconfig
          make O=out -j"$(nproc)"

      # ============================================================
      # VERIFICACIÓN
      # ============================================================
      - name: Verificar salida
        working-directory: kernel
        run: |
          ls -la out/arch/arm64/boot/Image*
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ ERROR: No se generó Image"
            exit 1
          fi

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: a7y18lte-kernel-bundle
          path: kernel/out/arch/arm64/boot/Image*
          if-no-files-found: error
