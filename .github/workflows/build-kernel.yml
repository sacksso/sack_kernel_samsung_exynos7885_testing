name: Build Kernel for a7y18lte (LineageOS 18.1) with Overclock

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout del kernel
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      - name: Checkout toolchain GCC 6.4.1
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses-dev git-core zip \
            gcc-arm-linux-gnueabi

      # ============================================================
      # FIX 1: decon_clocks_table (double -> unsigned long)
      # ============================================================
      - name: Corregir decon_clocks_table
        working-directory: kernel
        run: |
          sed -i 's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' drivers/video/fbdev/exynos/dpu_7885/decon_reg.c
          grep -n "^const unsigned long decon_clocks_table" drivers/video/fbdev/exynos/dpu_7885/decon_reg.c

      # ============================================================
      # FIX 2: topology.c (HMP if roto)
      # ============================================================
      - name: Corregir topology.c
        working-directory: kernel
        run: |
          sed -i 's/if (strlen(CONFIG_HMP_FAST_CPU_MASK)) (strlen(CONFIG_HMP_SLOW_CPU_MASK)); {/if (strlen(CONFIG_HMP_FAST_CPU_MASK) \&\& strlen(CONFIG_HMP_SLOW_CPU_MASK)) {/' arch/arm64/kernel/topology.c
          grep -n "strlen(CONFIG_HMP_FAST_CPU_MASK)" arch/arm64/kernel/topology.c

      # ============================================================
      # FIX 3: nl80211_vendor.c (country_code sin inicializar)
      # ============================================================
      - name: Corregir nl80211_vendor.c
        working-directory: kernel
        run: |
          sed -i 's/char country_code\[SLSI_COUNTRY_CODE_LEN\];/char country_code[SLSI_COUNTRY_CODE_LEN] = {0};/' drivers/net/wireless/scsc/nl80211_vendor.c
          grep -n "char country_code\[SLSI_COUNTRY_CODE_LEN\]" drivers/net/wireless/scsc/nl80211_vendor.c

      # ============================================================
      # OVERCLOCK CPU (BIG: 2.288 GHz, LITTLE: 1.794 GHz)
      # ============================================================
      - name: Overclock CPU Big a 2288 MHz
        working-directory: kernel
        run: |
          # Insertar 2288000 en la tabla mif-perf de domain@1 (antes de 2184000)
          sed -i '/^[[:space:]]*table = < 2184000 1794000/ i\           2288000 1794000' arch/arm64/boot/dts/exynos/exynos7885.dtsi
          # Insertar en min-limit
          sed -i '/^[[:space:]]*table = < 2184000 1586000/ i\           2288000 1586000' arch/arm64/boot/dts/exynos/exynos7885.dtsi
          # Insertar en max-limit (misma línea que min-limit, pero como son dos tablas, el sed las modificará ambas)
          sed -i '/^[[:space:]]*table = < 2184000 1586000/ i\           2288000 1586000' arch/arm64/boot/dts/exynos/exynos7885.dtsi
          grep -n "2288000" arch/arm64/boot/dts/exynos/exynos7885.dtsi

      - name: Overclock CPU Little a 1794 MHz
        working-directory: kernel
        run: |
          # Insertar 1794000 en la tabla mif-perf de domain@0 (antes de 1690000)
          sed -i '/^[[:space:]]*table = < 1690000 1014000/ i\           1794000 1014000' arch/arm64/boot/dts/exynos/exynos7885.dtsi
          grep -n "1794000" arch/arm64/boot/dts/exynos/exynos7885.dtsi

      # ============================================================
      # COMPILACIÓN
      # ============================================================
      - name: Compilar kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          make O=out lineage_a7y18lte_defconfig
          make O=out -j"$(nproc)"

      # ============================================================
      # VERIFICAR SALIDA
      # ============================================================
      - name: Verificar salida
        working-directory: kernel
        run: |
          ls -la out/arch/arm64/boot/Image*
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "❌ ERROR: No se generó Image"
            exit 1
          fi
          echo "✅ Image generado correctamente"

      # ============================================================
      # EMPAQUETADO ANY KERNEL 3 (ZIP FLASHEABLE)
      # ============================================================
      - name: Preparar AnyKernel3
        run: |
          # Clonar AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          # Copiar el Image compilado
          cp kernel/out/arch/arm64/boot/Image anykernel/
          # Configurar anykernel.sh para a7y18lte
          cat > anykernel/anykernel.sh << 'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          properties() { '
          kernel.string=a7y18lte kernel with overclock
          do.devicecheck=1
          do.modules=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=a7y18lte
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          '; }

          block=/dev/block/by-name/BOOT;
          is_slot_device=0;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          # Crear el ZIP
          cd anykernel
          zip -r ../AnyKernel3-a7y18lte-overclock.zip . -x "*\.git*" -x "*\.github*"
          cd ..

      # ============================================================
      # SUBIR ARTEFACTOS (Image, Image.gz y ZIP)
      # ============================================================
      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: a7y18lte-kernel-bundle
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            AnyKernel3-a7y18lte-overclock.zip
          if-no-files-found: error
