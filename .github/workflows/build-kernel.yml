name: Build Kernel for a7y18lte (LineageOS 18.1) - Stable + AnyKernel3 + Mejoras (schedutil, ZSTD, BFQ, WireGuard)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120   # más tiempo por WireGuard y BFQ

    steps:

      # ============================================================
      # 1. CHECKOUTS
      # ============================================================

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: exynos7885-dev/kernel_samsung_exynos7885
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      - name: Checkout GCC 6.4.1 toolchain
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1
          ref: lineage-18.1
          path: toolchain/aarch64
          fetch-depth: 1

      # Necesitamos el otro fork (prashantpaddune) para extraer BFQ y WireGuard
      - name: Checkout kernel donante (para BFQ y WireGuard)
        uses: actions/checkout@v4
        with:
          repository: prashantpaddune/android_kernel_samsung_a7y18lte
          # Usamos la rama por defecto (master o main) - si no, especificar
          # ref: master
          path: donor
          fetch-depth: 1

      # ============================================================
      # 2. DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            git-core \
            zip \
            gcc-arm-linux-gnueabi \
            rsync   # necesario para copiar árboles

      # ============================================================
      # 3. LOS 3 FIXES BASE (obligatorios)
      # ============================================================

      - name: Fix decon_clocks_table
        working-directory: kernel
        run: |
          sed -i \
          's/^const double decon_clocks_table/const unsigned long decon_clocks_table/' \
          drivers/video/fbdev/exynos/dpu_7885/decon_reg.c
          grep -n "^const unsigned long decon_clocks_table" drivers/video/fbdev/exynos/dpu_7885/decon_reg.c

      - name: Fix topology.c warning
        working-directory: kernel
        run: |
          sed -i \
          's/if (strlen(CONFIG_HMP_FAST_CPU_MASK)) (strlen(CONFIG_HMP_SLOW_CPU_MASK)); {/if (strlen(CONFIG_HMP_FAST_CPU_MASK) \&\& strlen(CONFIG_HMP_SLOW_CPU_MASK)) {/' \
          arch/arm64/kernel/topology.c
          grep -n "strlen(CONFIG_HMP_FAST_CPU_MASK)" arch/arm64/kernel/topology.c

      - name: Fix nl80211 country_code
        working-directory: kernel
        run: |
          sed -i \
          's/char country_code\[SLSI_COUNTRY_CODE_LEN\];/char country_code[SLSI_COUNTRY_CODE_LEN] = {0};/' \
          drivers/net/wireless/scsc/nl80211_vendor.c
          grep -n "char country_code\[SLSI_COUNTRY_CODE_LEN\]" drivers/net/wireless/scsc/nl80211_vendor.c

      # ============================================================
      # 4. TCP CUBIC (por defecto)
      # ============================================================

      - name: Set default TCP congestion control to cubic
        working-directory: kernel
        run: |
          sed -i \
          's/^CONFIG_DEFAULT_TCP_CONG="bic"/CONFIG_DEFAULT_TCP_CONG="cubic"/' \
          arch/arm64/configs/lineage_a7y18lte_defconfig
          grep -n "^CONFIG_DEFAULT_TCP_CONG" arch/arm64/configs/lineage_a7y18lte_defconfig

      # ============================================================
      # 5. SCHEDUTIL (gobernador moderno)
      # ============================================================

      - name: Enable schedutil governor
        working-directory: kernel
        run: |
          sed -i 's/# CONFIG_CPU_FREQ_GOV_SCHEDUTIL is not set/CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y/' \
            arch/arm64/configs/lineage_a7y18lte_defconfig
          grep "CONFIG_CPU_FREQ_GOV_SCHEDUTIL" arch/arm64/configs/lineage_a7y18lte_defconfig

      # ============================================================
      # 6. ZSTD PARA ZRAM
      # ============================================================

      - name: Enable ZSTD compression for zram
        working-directory: kernel
        run: |
          sed -i 's/# CONFIG_CRYPTO_ZSTD is not set/CONFIG_CRYPTO_ZSTD=y/' \
            arch/arm64/configs/lineage_a7y18lte_defconfig
          grep "CONFIG_CRYPTO_ZSTD" arch/arm64/configs/lineage_a7y18lte_defconfig
          # Opcional: definir ZSTD como compresor por defecto para zram
          # (si la línea CONFIG_ZRAM_DEF_COMP existe, la cambiamos)
          if grep -q "^CONFIG_ZRAM_DEF_COMP=" arch/arm64/configs/lineage_a7y18lte_defconfig; then
            sed -i 's/^CONFIG_ZRAM_DEF_COMP=.*/CONFIG_ZRAM_DEF_COMP="zstd"/' \
              arch/arm64/configs/lineage_a7y18lte_defconfig
          else
            echo 'CONFIG_ZRAM_DEF_COMP="zstd"' >> arch/arm64/configs/lineage_a7y18lte_defconfig
          fi
          grep "ZRAM_DEF_COMP" arch/arm64/configs/lineage_a7y18lte_defconfig

      # ============================================================
      # 7. BFQ (I/O SCHEDULER) - portado desde el kernel donante
      # ============================================================

      - name: Port BFQ scheduler from donor kernel
        working-directory: kernel
        run: |
          # Copiar todos los archivos BFQ (block/bfq-*)
          rsync -av --include='bfq-*' --include='*/' --exclude='*' \
            ../donor/block/ block/
          # Asegurar que existen los archivos principales
          ls -la block/bfq-*.c block/bfq-*.h

          # Modificar block/Kconfig.iosched para incluir BFQ
          # Si no existe la entrada, la añadimos al final
          if ! grep -q "config IOSCHED_BFQ" block/Kconfig.iosched; then
            cat >> block/Kconfig.iosched << 'EOF'

          config IOSCHED_BFQ
            tristate "BFQ I/O scheduler"
            default y
            ---help---
              BFQ (Budget Fair Queueing) is a proportional-share I/O scheduler.
              It provides low latency and fairness.
          EOF
          fi

          # Modificar block/Makefile para compilar BFQ
          if ! grep -q "bfq" block/Makefile; then
            echo "obj-\$(CONFIG_IOSCHED_BFQ) += bfq-iosched.o bfq-cgroup.o" >> block/Makefile
          fi

          # Activar CONFIG_IOSCHED_BFQ en el defconfig
          sed -i 's/# CONFIG_IOSCHED_BFQ is not set/CONFIG_IOSCHED_BFQ=y/' \
            arch/arm64/configs/lineage_a7y18lte_defconfig
          grep "CONFIG_IOSCHED_BFQ" arch/arm64/configs/lineage_a7y18lte_defconfig

      # ============================================================
      # 8. WIREGUARD - portado desde el kernel donante
      # ============================================================

      - name: Port WireGuard from donor kernel
        working-directory: kernel
        run: |
          # Copiar todo net/wireguard
          rsync -av ../donor/net/wireguard/ net/wireguard/
          # Verificar que se copió
          ls -la net/wireguard/*.c net/wireguard/*.h

          # Modificar net/Kconfig para incluir WireGuard
          # Buscar si ya existe "source net/wireguard/Kconfig"
          if ! grep -q "net/wireguard/Kconfig" net/Kconfig; then
            # Insertar antes del último "endmenu" o al final
            sed -i '/^endmenu/i source "net/wireguard/Kconfig"' net/Kconfig
          fi

          # Modificar net/Makefile
          if ! grep -q "wireguard" net/Makefile; then
            echo "obj-\$(CONFIG_WIREGUARD) += wireguard/" >> net/Makefile
          fi

          # Activar CONFIG_WIREGUARD en defconfig
          sed -i 's/# CONFIG_WIREGUARD is not set/CONFIG_WIREGUARD=y/' \
            arch/arm64/configs/lineage_a7y18lte_defconfig
          # Si no existía la línea, la añadimos
          if ! grep -q "^CONFIG_WIREGUARD=" arch/arm64/configs/lineage_a7y18lte_defconfig; then
            echo "CONFIG_WIREGUARD=y" >> arch/arm64/configs/lineage_a7y18lte_defconfig
          fi
          grep "CONFIG_WIREGUARD" arch/arm64/configs/lineage_a7y18lte_defconfig

          # (Opcional) Copiar script de auto-actualización de WireGuard
          # desde el donante si existe
          if [ -f ../donor/scripts/fetch-latest-wireguard.sh ]; then
            cp ../donor/scripts/fetch-latest-wireguard.sh scripts/
            chmod +x scripts/fetch-latest-wireguard.sh
            echo "WireGuard auto-update script copied."
          else
            echo "No fetch-latest-wireguard.sh found in donor; skipping."
          fi

      # ============================================================
      # 9. COMPILACIÓN (sin KCFLAGS de supresión)
      # ============================================================

      - name: Compile kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/aarch64/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          make O=out lineage_a7y18lte_defconfig

          # Verificar que las opciones solicitadas estén realmente activas en .config
          grep -q "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" out/.config || { echo "ERROR: schedutil no activo"; exit 1; }
          grep -q "CONFIG_CRYPTO_ZSTD=y" out/.config || { echo "ERROR: ZSTD no activo"; exit 1; }
          grep -q "CONFIG_IOSCHED_BFQ=y" out/.config || { echo "ERROR: BFQ no activo"; exit 1; }
          grep -q "CONFIG_WIREGUARD=y" out/.config || { echo "ERROR: WireGuard no activo"; exit 1; }
          echo "Todas las opciones están correctamente habilitadas."

          make O=out -j"$(nproc)"

      - name: Verify kernel output
        working-directory: kernel
        run: |
          ls -lh out/arch/arm64/boot/Image*
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: Image not generated"
            exit 1
          fi
          echo "Kernel compiled successfully"

      # ============================================================
      # 10. EMPAQUETADO CON ANYKERNEL3
      # ============================================================

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: sacksso/AnyKernel3-a7y18lte
          path: anykernel3
          fetch-depth: 1

      - name: Copy Image to AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image anykernel3/Image
          ls -lh anykernel3/Image

      - name: Create build-info.txt
        run: |
          cat > anykernel3/build-info.txt <<EOF
          ============================================================
          a7y18lte Kernel Build (con mejoras)
          ============================================================
          Device: Samsung Galaxy A7 2018 (a7y18lte)
          Model: SM-A750F/FN/G
          Kernel: Linux 4.4.302
          Compiler: GCC 6.4.1 (aarch64-linux-gnu) + gcc-arm-linux-gnueabi (32-bit)
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Commit: $(git --git-dir=kernel/.git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          ============================================================
          Fixes base (obligatorios):
            - decon_clocks_table: double -> unsigned long
            - topology.c: corrección de sintaxis en HMP mask
            - nl80211_vendor.c: inicialización de country_code
          Mejoras incluidas:
            - TCP congestion control: cubic (en lugar de bic)
            - schedutil como gobernador de CPU
            - ZSTD para zram (mejor compresión)
            - BFQ I/O scheduler (sustituye a cfq)
            - WireGuard (VPN moderno, con script de auto-actualización)
          Sin overclock. Sin KCFLAGS de supresión.
          ============================================================
          EOF
          cat anykernel3/build-info.txt

      - name: Create flashable ZIP
        run: |
          cd anykernel3
          zip -r9 ../a7y18lte-Kernel-v2.zip . -x "*.git*"
          cd ..
          ls -lh a7y18lte-Kernel-v2.zip

      - name: Upload final ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: a7y18lte-Kernel-v2
          path: a7y18lte-Kernel-v2.zip
          if-no-files-found: error
